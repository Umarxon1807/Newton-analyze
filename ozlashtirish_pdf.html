<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="O'zlashtirish"/>
<meta name="theme-color" content="#07070f"/>
<title>O'zlashtirish Tahlili</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
html,body{min-height:100%;background:#07070f;color:#e2e8f0;overflow-x:hidden}
input,button,select{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:0;height:0}
.card{background:#0f0f1a;border:1.5px solid #1a1a2e;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal-bg{position:fixed;inset:0;background:#07070fdd;backdrop-filter:blur(10px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#0b0b18;border:1.5px solid #2a2a45;border-radius:22px;padding:20px 16px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto}
.sheet-bg{position:fixed;inset:0;background:#07070fcc;backdrop-filter:blur(8px);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.sheet-box{background:#0b0b18;border:1.5px solid #2a2a45;border-radius:22px 22px 0 0;padding:22px 18px 40px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.pill{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;cursor:pointer;flex-shrink:0}
.inp{width:100%;background:#07070f;border:1.5px solid #2a2a45;color:#e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none}
.inp:focus{border-color:#a78bfa}
.btn-primary{width:100%;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:14px}
.icon-btn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;border:1px solid transparent;flex-shrink:0}
@keyframes zoomIn{from{transform:scale(0.75) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.zoom-in{animation:zoomIn .25s cubic-bezier(.34,1.56,.64,1)}
.slide-up{animation:slideUp .28s ease}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const SUBJECTS = ["Matematika", "Ingliz tili", "Muammoni hal qilish"];
const COLORS   = ["#34d399", "#60a5fa", "#f472b6"];

// ─── Helpers ─────────────────────────────────────────────────────────────────
const uid  = () => Math.random().toString(36).slice(2,9);
const avg  = a  => a&&a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : 0;
const ovAvg= s  => Math.min(100, Math.round(SUBJECTS.reduce((sum,_,i)=>sum+avg(s.scores[i]),0)/SUBJECTS.length));
const grade= v  => v>=85?{l:"A'lo",c:"#34d399"}:v>=70?{l:"Yaxshi",c:"#60a5fa"}:v>=55?{l:"Qoniqarli",c:"#fbbf24"}:{l:"Qoniqarsiz",c:"#f87171"};
const parseFrac = str => {
  const s=str.trim();
  if(s.includes("/")){const[a,b]=s.split("/").map(Number);if(!isNaN(a)&&!isNaN(b)&&b>0)return Math.min(100,Math.round(a/b*100));}
  const n=Number(s);
  return (!isNaN(n)&&n>=0&&n<=100)?Math.round(n):null;
};
const load = k => { try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;} };
const save = (k,v) => { try{localStorage.setItem(k,JSON.stringify(v));}catch{} };
const fmtDay = d => d?d.slice(5):"";

// ─── State ────────────────────────────────────────────────────────────────────
let STATE = {
  teacher : load("st_teacher") || "Ustoz",
  lang    : load("st_lang")    || "uz",
  students: load("st_students")|| [],
  search  : "",
  view    : "list",        // list | detail | add | score | editName | delConfirm | teacher
  activeStudent: null,
  editTarget: null,        // {si, idx} for score edit
};
function setState(patch){ STATE = {...STATE,...patch}; render(); }

// ─── SVG Area Chart ───────────────────────────────────────────────────────────
function chartSVG(scores, days){
  if(!scores||!scores.length) return `<div style="color:#2a2a45;text-align:center;padding:24px 0;font-size:12px">Ma'lumot yo'q</div>`;
  const W=300,H=110,PL=34,PB=22,PT=16,PR=8,cW=W-PL-PR,cH=H-PB-PT;
  const pts=scores.map((v,i)=>({x:PL+(i/Math.max(scores.length-1,1))*cW,y:PT+cH-(v/100)*cH,v}));
  const poly=pts.map(p=>`${p.x},${p.y}`).join(" ");
  const area=`${pts[0].x},${PT+cH} ${poly} ${pts[pts.length-1].x},${PT+cH}`;
  const grow=scores.length>1&&scores[scores.length-1]>=scores[0];
  const diff=scores.length>1?Math.round((scores[scores.length-1]-scores[0])/Math.max(scores[0],1)*100):0;
  const lc=grow?"#34d399":"#f87171",fc=grow?"#34d39918":"#f8717118";
  const arrow=diff>0?"▲":diff<0?"▼":"—";
  const grids=[0,25,50,75,100].map(s=>{const y=PT+cH-(s/100)*cH;return`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#1e1e33" stroke-width="1"/><text x="${PL-4}" y="${y+4}" fill="#3a3a5a" font-size="8" text-anchor="end">${s}</text>`;}).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${lc}"/><text x="${p.x}" y="${p.y-6}" fill="${lc}" font-size="7" text-anchor="middle">${p.v}%</text><text x="${p.x}" y="${H-3}" fill="#3a3a5a" font-size="7" text-anchor="middle">${days&&days[i]?days[i]:i+1}</text>`).join("");
  return`<div style="display:flex;justify-content:flex-end;margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${lc};background:${lc}22;padding:2px 8px;border-radius:20px">${arrow} ${Math.abs(diff)}%</span></div>
<svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">${grids}<polygon points="${area}" fill="${fc}"/><polyline points="${poly}" fill="none" stroke="${lc}" stroke-width="2" stroke-linejoin="round"/>${dots}<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+cH}" stroke="#2a2a45" stroke-width="1"/></svg>`;
}

// ─── Score entry form HTML ─────────────────────────────────────────────────────
function scoreEntryHTML(entries, prefix){
  return entries.map((en,idx)=>`
  <div id="entry_${prefix}_${en.id}" style="background:#0f0f1a;border:1px solid #1e1e33;border-radius:12px;padding:12px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:11px;color:#888">${idx+1}-natija</span>
      ${entries.length>1?`<span onclick="removeEntry('${prefix}','${en.id}')" style="color:#f87171;font-size:16px;cursor:pointer">✕</span>`:""}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      ${["Matematik","Ingliz","Tanqidiy"].map((lbl,si)=>`<div onclick="setEntrySi('${prefix}','${en.id}',${si})" style="flex:1;text-align:center;padding:7px 4px;border-radius:8px;font-size:10px;font-weight:600;cursor:pointer;border:1.5px solid ${en.si===si?COLORS[si]:"#1e1e33"};color:${en.si===si?COLORS[si]:"#555"};background:${en.si===si?COLORS[si]+"18":"transparent"}">${lbl}</div>`).join("")}
    </div>
    <div style="display:flex;gap:8px">
      <div style="flex:1">
        <div style="font-size:10px;color:#555;margin-bottom:4px">Natija</div>
        <input value="${escHtml(en.score)}" placeholder="12/20 yoki 85"
          oninput="syncEntry('${prefix}','${en.id}','score',this.value)"
          style="width:100%;background:#07070f;border:1.5px solid ${COLORS[en.si]}44;color:#e2e8f0;border-radius:8px;padding:9px 10px;font-size:13px;outline:none;font-family:monospace"/>
      </div>
      <div style="flex:1">
        <div style="font-size:10px;color:#555;margin-bottom:4px">Sana</div>
        <input type="date" value="${en.date}"
          onchange="syncEntry('${prefix}','${en.id}','date',this.value)"
          style="width:100%;background:#07070f;border:1.5px solid #2a2a45;color:#888;border-radius:8px;padding:9px 10px;font-size:12px;outline:none"/>
      </div>
    </div>
    <div id="preview_${prefix}_${en.id}" style="margin-top:7px;font-size:10px;color:${COLORS[en.si]}">
      ${en.score&&parseFrac(en.score)!==null?`→ ${parseFrac(en.score)}% (${grade(parseFrac(en.score)).l})`:""}</div>
  </div>`).join("");
}

// ─── Temporary form state ─────────────────────────────────────────────────────
let FORM = { add:{name:"",entries:[{id:uid(),si:0,score:"",date:""}],err:""},
             score:{entries:[{id:uid(),si:0,score:"",date:""}],err:""},
             editScore:{score:"",date:"",err:""} };

function resetForm(key){ 
  if(key==="add") FORM.add={name:"",entries:[{id:uid(),si:0,score:"",date:""}],err:""};
  if(key==="score") FORM.score={entries:[{id:uid(),si:0,score:"",date:""}],err:""};
  if(key==="editScore") FORM.editScore={score:"",date:"",err:""};
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render(){
  const root = document.getElementById("root");
  root.innerHTML = buildHTML();
  attachEvents();
}

function buildHTML(){
  const {teacher,lang,students,search,view,activeStudent,editTarget} = STATE;
  const initial = teacher.trim()?teacher.trim()[0].toUpperCase():"U";
  const filtered = students.filter(s=>s.name.toLowerCase().includes(search.toLowerCase()));
  const stats = {
    total:students.length,
    alo:students.filter(s=>ovAvg(s)>=85).length,
    yaxshi:students.filter(s=>ovAvg(s)>=70&&ovAvg(s)<85).length,
    past:students.filter(s=>ovAvg(s)<55).length
  };

  // ── Header
  const header = `
  <div style="background:linear-gradient(135deg,#0d0d1f,#12122a);border-bottom:1px solid #1a1a30;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100">
    <div class="pill" onclick="openView('teacher')" style="background:linear-gradient(135deg,#7c3aed,#4f46e5);font-size:20px;font-weight:900;color:#fff;box-shadow:0 0 0 2px #a78bfa44">${initial}</div>
    <div class="pill" onclick="openView('add')" style="background:#111127;border:2px dashed #a78bfa66;font-size:24px;color:#a78bfa">+</div>
    <div class="pill" onclick="toggleLang()" style="background:#111127;border:1.5px solid #2a2a45;font-size:10px;font-weight:900;color:#a78bfa">${lang==="uz"?"UZ":"RU"}</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:17px;font-weight:900;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lang==="uz"?"O'zlashtirish Tahlili":"Анализ Успеваемости"}</div>
      <div style="font-size:9px;color:#3a3a5a">${lang==="uz"?"Test natijalari asosida":"По результатам тестов"}</div>
    </div>
  </div>`;

  // ── Stats
  const statsBar = `
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 14px 0">
    ${[["Jami","Всего",stats.total,"#a78bfa"],["A'lo ≥85%","A'lo ≥85%",stats.alo,"#34d399"],["70–84%","70–84%",stats.yaxshi,"#60a5fa"],["<55%","<55%",stats.past,"#f87171"]].map(([uz,ru,v,c])=>`
    <div style="background:#0f0f1a;border:1px solid ${c}33;border-radius:12px;padding:10px 6px;text-align:center">
      <div style="font-size:22px;font-weight:900;color:${c};font-family:monospace">${v}</div>
      <div style="font-size:9px;color:#555;margin-top:1px">${lang==="uz"?uz:ru}</div>
    </div>`).join("")}
  </div>`;

  // ── Search
  const searchBar = `
  <div style="padding:14px 14px 0;position:relative">
    <div style="display:flex;align-items:center;gap:10px;background:#0f0f1a;border:1.5px solid #2a2a45;border-radius:999px;padding:11px 20px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" value="${escHtml(search)}" oninput="handleSearch(this.value)" placeholder="${lang==="uz"?"O'quvchi qidiring...":"Поиск ученика..."}" style="flex:1;background:transparent;border:none;outline:none;color:#e2e8f0;font-size:14px"/>
      ${search?`<div onclick="handleSearch('')" style="color:#444;cursor:pointer;font-size:15px">✕</div>`:""}
    </div>
  </div>`;

  // ── Student list
  const list = `
  <div style="padding:14px">
    ${filtered.length===0?`<div style="text-align:center;color:#2a2a45;padding:56px 0;font-size:13px">${students.length===0?"Hali o'quvchi yo'q. ＋ tugmasidan boshlang!":"Hech kim topilmadi"}</div>`:
    filtered.map(s=>{
      const ov=ovAvg(s),g=grade(ov);
      return`<div class="card">
        <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
          <div class="icon-btn" onclick="openEdit('${s.id}')" style="background:#4f46e522;border-color:#4f46e555">✏️</div>
          <div class="icon-btn" onclick="openDel('${s.id}')" style="background:#dc262622;border-color:#dc262655">🗑️</div>
        </div>
        <div onclick="openDetail('${s.id}')" style="flex:1;cursor:pointer">
          <div style="font-size:15px;font-weight:700;color:#e2e8f0">${escHtml(s.name)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
          <button onclick="openScore('${s.id}')" style="background:#1a1a2e;border:1px solid #2a2a45;color:#a78bfa;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700">+ Ball</button>
          <div onclick="openDetail('${s.id}')" style="text-align:right;cursor:pointer">
            <div style="font-size:22px;font-weight:900;color:${g.c};font-family:monospace">${ov}%</div>
            <div style="font-size:9px;color:${g.c};background:${g.c}22;border-radius:6px;padding:2px 6px">${g.l}</div>
          </div>
        </div>
      </div>`;
    }).join("")}
  </div>`;

  // ── Detail modal
  let detailModal = "";
  if(view==="detail" && activeStudent){
    const s = activeStudent;
    const ov=ovAvg(s),g=grade(ov);
    const subjectBlocks = SUBJECTS.map((subj,si)=>{
      const scores=s.scores[si]||[];
      const days=(s.days&&s.days[si])||[];
      const indexed=scores.map((v,i)=>({v,d:days[i]||"",i})).sort((a,b)=>a.d.localeCompare(b.d));
      const et = editTarget;
      const entryRows = indexed.map(({v,d,i})=>{
        const isEditing = et&&et.si===si&&et.idx===i;
        if(isEditing) return `
          <div style="background:${COLORS[si]}0e;border:1px solid ${COLORS[si]}44;border-radius:10px;padding:10px;margin-bottom:6px">
            <div style="display:flex;gap:8px;margin-bottom:6px">
              <input id="editScoreInp" value="${escHtml(FORM.editScore.score)}" oninput="syncEditScore(this.value)" placeholder="12/20 yoki 85" style="flex:1;background:#07070f;border:1.5px solid ${COLORS[si]};color:#e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;font-family:monospace"/>
              <input type="date" id="editDateInp" value="${FORM.editScore.date}" onchange="FORM.editScore.date=this.value" style="flex:1;background:#07070f;border:1.5px solid #2a2a45;color:#888;border-radius:8px;padding:8px 10px;font-size:12px;outline:none"/>
            </div>
            ${FORM.editScore.err?`<div style="color:#f87171;font-size:10px;margin-bottom:6px">${FORM.editScore.err}</div>`:""}
            <div id="editScorePreview" style="font-size:10px;color:${COLORS[si]};margin-bottom:6px">${FORM.editScore.score&&parseFrac(FORM.editScore.score)!==null?`→ ${parseFrac(FORM.editScore.score)}% (${grade(parseFrac(FORM.editScore.score)).l})`:""}</div>
            <div style="display:flex;gap:8px">
              <button onclick="saveEntryEdit(${si},${i})" style="flex:1;background:${COLORS[si]};color:#000;border:none;border-radius:8px;padding:7px;font-weight:700;font-size:12px">✓ Saqlash</button>
              <button onclick="cancelEntryEdit()" style="flex:1;background:#1a1a2e;border:1px solid #2a2a45;color:#666;border-radius:8px;padding:7px;font-size:12px">Bekor</button>
            </div>
          </div>`;
        return `
          <div style="display:flex;align-items:center;gap:8px;background:#0f0f1a;border-radius:10px;padding:8px 12px;margin-bottom:6px">
            <div style="flex:1">
              <span style="font-family:monospace;font-weight:700;color:${COLORS[si]};font-size:14px">${v}%</span>
              ${d?`<span style="font-size:10px;color:#444;margin-left:8px">${fmtDay(d)}</span>`:""}
            </div>
            <div class="icon-btn" onclick="startEntryEdit(${si},${i},'${v}','${d}')" style="background:#4f46e522;border-color:#4f46e544">✏️</div>
            <div class="icon-btn" onclick="deleteEntry(${si},${i})" style="background:#dc262622;border-color:#dc262644">🗑️</div>
          </div>`;
      }).join("");
      return `
        <div style="margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:11px;font-weight:700;color:${COLORS[si]}">${subj}</span>
            <span style="font-size:10px;color:#555;font-family:monospace">o'rta: ${avg(scores)}%</span>
          </div>
          <div style="background:#07070f;border-radius:12px;padding:8px;margin-bottom:8px;overflow-x:auto">
            ${chartSVG(indexed.map(x=>x.v),indexed.map(x=>fmtDay(x.d)))}
          </div>
          ${entryRows}
        </div>`;
    }).join("");

    detailModal = `
    <div class="modal-bg" onclick="closeDetail()">
      <div class="modal-box zoom-in" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px">
          <div>
            <div style="font-size:19px;font-weight:900;color:#e2e8f0">${escHtml(s.name)}</div>
            <div style="font-size:10px;color:#3a3a5a;margin-top:2px">Butun davr tahlili</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:28px;font-weight:900;color:${g.c};font-family:monospace">${ov}%</div>
            <div style="font-size:10px;color:${g.c};background:${g.c}22;border-radius:6px;padding:2px 8px">${g.l}</div>
          </div>
        </div>
        ${subjectBlocks}
        <div style="display:flex;gap:10px;margin-top:4px">
          <button onclick="generatePDF('${s.id}')" style="flex:1;background:#c0392b;border:none;color:#fff;border-radius:10px;padding:10px;font-size:12px;font-weight:700">📄 PDF</button>
          <button onclick="closeDetail()" style="flex:1;background:#1a1a2e;border:1px solid #2a2a45;color:#666;border-radius:10px;padding:10px;font-size:12px">Yopish ✕</button>
        </div>
      </div>
    </div>`;
  }

  // ── Add student modal
  let addModal = "";
  if(view==="add"){
    addModal = `
    <div class="sheet-bg" onclick="closeView()">
      <div class="sheet-box slide-up" onclick="event.stopPropagation()">
        <div style="width:40px;height:4px;background:#2a2a45;border-radius:4px;margin:0 auto 20px"></div>
        <div style="font-size:18px;font-weight:900;color:#e2e8f0;margin-bottom:16px">O'quvchi qo'shish</div>
        <div style="margin-bottom:16px">
          <div style="font-size:11px;color:#555;margin-bottom:6px">Familiya va ism</div>
          <input class="inp" id="addName" value="${escHtml(FORM.add.name)}" oninput="FORM.add.name=this.value" placeholder="Abdullayev Islom" autofocus/>
        </div>
        <div style="font-size:11px;color:#555;margin-bottom:10px">Natijalar <span style="color:#3a3a5a">(ixtiyoriy)</span></div>
        ${scoreEntryHTML(FORM.add.entries,"add")}
        <div onclick="addEntry('add')" style="border:1.5px dashed #2a2a45;border-radius:12px;padding:11px;text-align:center;color:#3a3a5a;font-size:12px;cursor:pointer;margin-bottom:14px">+ Yana natija</div>
        ${FORM.add.err?`<div style="color:#f87171;font-size:11px;margin-bottom:12px;padding:8px 12px;background:#f8717118;border-radius:8px">${FORM.add.err}</div>`:""}
        <button class="btn-primary" onclick="saveStudent()">Saqlash</button>
      </div>
    </div>`;
  }

  // ── Add score modal
  let scoreModal = "";
  if(view==="score" && activeStudent){
    scoreModal = `
    <div class="sheet-bg" onclick="closeView()">
      <div class="sheet-box slide-up" onclick="event.stopPropagation()">
        <div style="width:40px;height:4px;background:#2a2a45;border-radius:4px;margin:0 auto 20px"></div>
        <div style="font-size:16px;font-weight:900;color:#e2e8f0;margin-bottom:4px">${escHtml(activeStudent.name)}</div>
        <div style="font-size:11px;color:#555;margin-bottom:16px">Yangi natija qo'shish</div>
        ${scoreEntryHTML(FORM.score.entries,"score")}
        <div onclick="addEntry('score')" style="border:1.5px dashed #2a2a45;border-radius:12px;padding:11px;text-align:center;color:#3a3a5a;font-size:12px;cursor:pointer;margin-bottom:14px">+ Yana natija</div>
        ${FORM.score.err?`<div style="color:#f87171;font-size:11px;margin-bottom:10px;padding:8px 12px;background:#f8717118;border-radius:8px">${FORM.score.err}</div>`:""}
        <button class="btn-primary" onclick="saveScore()">Saqlash</button>
      </div>
    </div>`;
  }

  // ── Edit name modal
  let editNameModal = "";
  if(view==="editName" && activeStudent){
    editNameModal = `
    <div class="modal-bg" onclick="closeView()">
      <div style="background:#0b0b18;border:1.5px solid #a78bfa44;border-radius:18px;padding:24px 20px;width:100%;max-width:320px" class="zoom-in" onclick="event.stopPropagation()">
        <div style="font-size:16px;font-weight:700;margin-bottom:14px;color:#e2e8f0">Ismni tahrirlash</div>
        <input class="inp" id="editNameInp" value="${escHtml(activeStudent.name)}" oninput="FORM.editName=this.value" autofocus/>
        <button onclick="saveEditName()" style="margin-top:12px;width:100%;background:#a78bfa;color:#000;border:none;border-radius:8px;padding:10px;font-weight:700;font-size:13px">Saqlash</button>
      </div>
    </div>`;
    FORM.editName = activeStudent.name;
  }

  // ── Delete confirm
  let delModal = "";
  if(view==="delConfirm" && activeStudent){
    delModal = `
    <div class="modal-bg" onclick="closeView()">
      <div style="background:#0b0b18;border:1.5px solid #f8717144;border-radius:18px;padding:24px 20px;width:100%;max-width:300px;text-align:center" class="zoom-in" onclick="event.stopPropagation()">
        <div style="font-size:36px;margin-bottom:12px">🗑️</div>
        <div style="font-size:15px;font-weight:700;color:#e2e8f0;margin-bottom:6px">O'chirishni tasdiqlang</div>
        <div style="font-size:12px;color:#f87171;margin-bottom:20px">"${escHtml(activeStudent.name)}"</div>
        <div style="display:flex;gap:10px">
          <button onclick="closeView()" style="flex:1;background:#1a1a2e;border:1px solid #2a2a45;color:#888;border-radius:10px;padding:10px;font-weight:700;font-size:13px">Bekor</button>
          <button onclick="confirmDel()" style="flex:1;background:#dc2626;border:none;color:#fff;border-radius:10px;padding:10px;font-weight:700;font-size:13px">O'chir</button>
        </div>
      </div>
    </div>`;
  }

  // ── Teacher modal
  let teacherModal = "";
  if(view==="teacher"){
    teacherModal = `
    <div class="modal-bg" onclick="closeView()">
      <div style="background:#0b0b18;border:1.5px solid #a78bfa44;border-radius:18px;padding:24px 20px;width:100%;max-width:300px" class="zoom-in" onclick="event.stopPropagation()">
        <div style="font-size:16px;font-weight:700;margin-bottom:14px;color:#e2e8f0">Ustoz ismi</div>
        <input class="inp" id="teacherInp" value="${escHtml(STATE.teacher)}" oninput="FORM.teacher=this.value" autofocus/>
        <button onclick="saveTeacher()" style="margin-top:12px;width:100%;background:#a78bfa;color:#000;border:none;border-radius:8px;padding:10px;font-weight:700;font-size:13px">Saqlash</button>
      </div>
    </div>`;
    FORM.teacher = STATE.teacher;
  }

  return `${header}${statsBar}${searchBar}<div style="padding-bottom:30px">${list}</div>${detailModal}${addModal}${scoreModal}${editNameModal}${delModal}${teacherModal}`;
}

}
function removeEntry(prefix,id){
  FORM[prefix].entries=FORM[prefix].entries.filter(e=>e.id!==id);

}
function setEntrySi(prefix,id,si){

// Sync entry without re-render (prevents flicker)
function syncEntry(prefix, id, field, val){
  FORM[prefix].entries = FORM[prefix].entries.map(e=>e.id===id?{...e,[field]:val}:e);
  if(field==="score"){
    const entry = FORM[prefix].entries.find(e=>e.id===id);
    const preview = document.getElementById(`preview_${prefix}_${id}`);
    if(preview && entry){
      const p = parseFrac(val);
      preview.textContent = (p!==null&&val.trim()) ? `→ ${p}% (${grade(p).l})` : "";
      preview.style.color = COLORS[entry.si];
    }
  }
}

function saveStudent(){
  const name=(FORM.add.name||"").trim();
  if(!name){FORM.add.err="Ism kiriting";render();return;}
  const scores=[[],[],[]],days=[[],[],[]];
  for(const en of FORM.add.entries){
    if(!en.score.trim())continue;
    const p=parseFrac(en.score);
    if(p===null){FORM.add.err=`"${en.score}" noto'g'ri. Masalan: 12/20`;render();return;}
    scores[en.si].push(p);days[en.si].push(en.date||"");
  }
  const newStudents=[...STATE.students,{id:uid(),name,scores,days}];
  save("st_students",newStudents);
  resetForm("add");
  setState({students:newStudents,view:"list"});
}

function saveScore(){
  const s=STATE.activeStudent;if(!s)return;
  const ns=[[],[],[]],nd=[[],[],[]];
  for(const en of FORM.score.entries){
    if(!en.score.trim())continue;
    const p=parseFrac(en.score);
    if(p===null){FORM.score.err=`"${en.score}" noto'g'ri`;render();return;}
    ns[en.si].push(p);nd[en.si].push(en.date||"");
  }
  const days=s.days||[[],[],[]];
  const updated={...s,scores:s.scores.map((a,i)=>[...a,...ns[i]]),days:days.map((a,i)=>[...a,...nd[i]])};
  const newStudents=STATE.students.map(x=>x.id===updated.id?updated:x);
  save("st_students",newStudents);
  resetForm("score");
  setState({students:newStudents,view:"list",activeStudent:null});
}

// ─── PDF Generator ────────────────────────────────────────────────────────────
function generatePDF(studentId) {
  const s = STATE.students.find(x => x.id === studentId);
  if (!s) return;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

  const PAGE_W = 210, PAGE_H = 297;
  const ML = 15, MR = 15, MT = 15;
  const CW = PAGE_W - ML - MR; // content width
  let y = MT;

  // ── Colors ──────────────────────────────────────────────────────
  const C_BG      = [255,255,255];
  const C_CARD    = [238,238,238];
  const C_CHART   = [240,240,240];
  const C_GRID    = [204,204,204];
  const C_DARK    = [17,17,17];
  const C_GRAY    = [85,85,85];
  const C_RED     = [192,57,43];
  const C_BLUE    = [41,128,185];
  const C_GREEN   = [39,174,96];
  const SUB_COLORS = [C_RED, C_BLUE, C_GREEN];

  // Helpers
  const subAvg = (si) => {
    const sc = s.scores[si] || [];
    return sc.length ? Math.round(sc.reduce((a,b)=>a+b,0)/sc.length) : 0;
  };
  const ovAvgVal = () => Math.min(100, Math.round(
    [0,1,2].reduce((sum,i) => sum + subAvg(i), 0) / 3
  ));
  const gradeInfo = (v) =>
    v>=85 ? {l:"A'lo",    c:C_GREEN} :
    v>=70 ? {l:"Yaxshi",  c:C_BLUE}  :
    v>=55 ? {l:"Qoniqarli", c:[251,191,36]} :
            {l:"Qoniqarsiz", c:C_RED};

  function setFill(rgb)   { doc.setFillColor(...rgb); }
  function setStroke(rgb) { doc.setDrawColor(...rgb); }
  function setTxt(rgb)    { doc.setTextColor(...rgb); }
  function roundRect(x,xw,yy,h,r,fill,stroke){
    setFill(fill||C_CARD);
    if(stroke) setStroke(stroke); else doc.setDrawColor(0,0,0,0);
    doc.roundedRect(x, yy, xw, h, r||3, r||3, stroke?'FD':'F');
  }

  // ── White background ─────────────────────────────────────────────
  setFill(C_BG);
  doc.rect(0, 0, PAGE_W, PAGE_H, 'F');

  // ── HEADER CARD ──────────────────────────────────────────────────
  const HCARD_H = 22;
  roundRect(ML, CW, y, HCARD_H, 4, C_CARD);
  // Name
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  setTxt(C_DARK);
  doc.text(s.name, ML+5, y+9);
  // Subtitle
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  setTxt(C_GRAY);
  doc.text("Butun davr tahlili", ML+5, y+16);
  // Overall %
  const ov = ovAvgVal(), gi = gradeInfo(ov);
  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  setTxt(gi.c);
  doc.text(ov + "%", PAGE_W - MR - 5, y+10, {align:'right'});
  doc.setFontSize(8);
  doc.text(gi.l, PAGE_W - MR - 5, y+17, {align:'right'});
  y += HCARD_H + 7;

  // ── SUBJECTS ─────────────────────────────────────────────────────
  const SUBJECTS_LIST = ["Matematika","Ingliz tili","Muammoni hal qilish"];
  const PAGE2_SUBJECTS = [2]; // Muammoni hal qilish on page 2

  for (let si = 0; si < 3; si++) {
    const scores = s.scores[si] || [];
    const days   = (s.days && s.days[si]) || [];

    // Sort by date
    const indexed = scores
      .map((v,i) => ({v, d: days[i]||""}))
      .sort((a,b) => a.d.localeCompare(b.d));
    const sortedScores = indexed.map(x=>x.v);
    const sortedDays   = indexed.map(x=>x.d?x.d.slice(5):"");

    const SA = subAvg(si);
    const SC = SUB_COLORS[si];
    const CHART_H = 38;
    const ROW_H   = 8;
    const SCORE_BLOCK_H = indexed.length * ROW_H;
    const SECTION_H = 8 + 4 + CHART_H + 16 + 4 + SCORE_BLOCK_H + 10;

    // Page break: Muammoni hal qilish goes to page 2
    if (si === 2) {
      doc.addPage();
      setFill(C_BG); doc.rect(0,0,PAGE_W,PAGE_H,'F');
      y = MT;
    }

    // ── Section header ─────────────────────────────────────────────
    roundRect(ML, CW, y, 10, 3, C_CARD);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); setTxt(SC);
    doc.text(SUBJECTS_LIST[si], ML+5, y+7.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); setTxt(C_GRAY);
    doc.text("o'rta: " + SA + "%", PAGE_W-MR-3, y+7.5, {align:'right'});
    y += 12;

    // ── Chart area (full grey rect) ─────────────────────────────────
    const CHART_Y = y;
    const PAD_L = 12, PAD_R = 6, PAD_T = 6, PAD_B = 10;
    const chartX = ML, chartW = CW;
    setFill(C_CHART); doc.setDrawColor(0,0,0,0);
    doc.rect(chartX, CHART_Y, chartW, CHART_H, 'F');

    const plotX  = chartX + PAD_L;
    const plotW  = chartW - PAD_L - PAD_R;
    const plotY  = CHART_Y + PAD_T;
    const plotH  = CHART_H - PAD_T - PAD_B;

    // Grid lines
    doc.setLineWidth(0.2); setStroke(C_GRID);
    [0,25,50,75,100].forEach(val => {
      const gy = plotY + plotH - (val/100)*plotH;
      doc.line(plotX, gy, plotX+plotW, gy);
      doc.setFontSize(5); setTxt(C_GRAY);
      doc.text(String(val), plotX-2, gy+1.5, {align:'right'});
    });

    if (sortedScores.length > 0) {
      const n = sortedScores.length;
      const pts = sortedScores.map((v,i) => ({
        x: plotX + (n===1 ? plotW/2 : i/(n-1)*plotW),
        y: plotY + plotH - (v/100)*plotH,
        v
      }));

      // Shaded area
      const [r,g,b] = SC;
      doc.setFillColor(r,g,b,0.15);
      doc.setDrawColor(0,0,0,0);
      if (pts.length === 1) {
        doc.rect(pts[0].x-2, pts[0].y, 4, plotY+plotH-pts[0].y, 'F');
      } else {
        // Polygon via lines trick — use a path
        doc.setFillColor(r,g,b);
        // Draw semi-transparent fill manually with low alpha
        const alpha = 0.13;
        // jsPDF doesn't support native alpha polygon easily,
        // so draw a thin filled rectangle strip approximation
        for(let i=0;i<pts.length-1;i++){
          const x1=pts[i].x, y1=pts[i].y, x2=pts[i+1].x, y2=pts[i+1].y;
          const bot = plotY+plotH;
          // Draw thin vertical slices for shading
          const steps = Math.ceil((x2-x1)*2);
          for(let s=0;s<steps;s++){
            const t=s/steps, t2=(s+1)/steps;
            const sx=x1+t*(x2-x1), ex=x1+t2*(x2-x1);
            const sy=y1+t*(y2-y1), ey=y1+t2*(y2-y1);
            const topY=Math.min(sy,ey);
            const botY=bot;
            doc.setFillColor(r,g,b,0.12);
            doc.rect(sx, topY, ex-sx+0.1, botY-topY,'F');
          }
        }
      }

      // Line
      doc.setLineWidth(0.8); setStroke(SC);
      for(let i=0;i<pts.length-1;i++){
        doc.line(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
      }

      // Dots + labels
      pts.forEach((p,i) => {
        setFill(SC); doc.setDrawColor(255,255,255);
        doc.circle(p.x, p.y, 1.2, 'F');
        doc.setFontSize(6); doc.setFont('helvetica','bold'); setTxt(SC);
        const labelY = p.y > plotY+8 ? p.y-3 : p.y+5;
        doc.text(p.v+"%", p.x, labelY, {align:'center'});
        // Date label
        if(sortedDays[i]){
          doc.setFontSize(5); doc.setFont('helvetica','normal'); setTxt(C_GRAY);
          doc.text(sortedDays[i], p.x, CHART_Y+CHART_H-1, {align:'center'});
        }
      });
    } else {
      doc.setFontSize(8); setTxt(C_GRAY);
      doc.text("Ma'lumot yo'q", ML+CW/2, CHART_Y+CHART_H/2, {align:'center'});
    }
    y += CHART_H + 4;

    // ── Score rows ──────────────────────────────────────────────────
    indexed.forEach((entry, idx) => {
      const rowY = y + idx*ROW_H;
      const isLast = idx === indexed.length-1;
      setFill(C_CHART); doc.setDrawColor(0,0,0,0);
      doc.rect(ML, rowY, CW, ROW_H, 'F');
      // divider
      if(!isLast){ setStroke(C_GRID); doc.setLineWidth(0.2); doc.line(ML, rowY+ROW_H, ML+CW, rowY+ROW_H); }
      // score
      doc.setFont('helvetica','bold'); doc.setFontSize(9); setTxt(SC);
      doc.text(entry.v+"%", ML+5, rowY+6);
      // date
      doc.setFont('helvetica','normal'); doc.setFontSize(8); setTxt(C_GRAY);
      if(entry.d) doc.text(entry.d.slice(5), ML+22, rowY+6);
    });
    y += Math.max(indexed.length,1)*ROW_H + 10;
  }

  // ── Footer ────────────────────────────────────────────────────────
  const today = new Date().toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'.');
  doc.setFont('helvetica','normal'); doc.setFontSize(7); setTxt(C_GRAY);
  doc.text("Hisobot sanasi: " + today, PAGE_W/2, PAGE_H-10, {align:'center'});

  // ── Save ──────────────────────────────────────────────────────────
  const filename = s.name.replace(/\s+/g,'_') + "_Hisobot.pdf";
  doc.save(filename);
}

render();
</script>
