/* Accordion */
.acc-content{overflow:hidden;max-height:0;transition:max-height 0.3s cubic-bezier(0.4,0,0.2,1);background:#07070f;border-radius:0 0 12px 12px}

@keyframes zoomIn{from{transform:scale(.75) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

<body>
<div id="root"></div>
<input type="file" id="fileInp" accept=".csv,.html,.htm" style="display:none"/>
<script>
// ══════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════
const SUBJ=["Matematika","Ingliz tili","Muammoni hal qilish"];
const SCOL=["#34d399","#60a5fa","#f472b6"];
const STAB=["Matematik","Ingliz","Tanqidiy"];

// ══════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════
const uid  =()=>Math.random().toString(36).slice(2,9);
const avg  =a=>a&&a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const ovAvg=s=>{const avgs=SUBJ.map((_,i)=>avg(s.scores[i])).filter(v=>v>0);return avgs.length?Math.min(100,Math.round(avgs.reduce((a,b)=>a+b,0)/avgs.length)):0;};
const grade=v=>v>=85?{l:"A'lo",c:"#34d399"}:v>=70?{l:"Yaxshi",c:"#60a5fa"}:v>=55?{l:"Qoniqarli",c:"#fbbf24"}:{l:"Qoniqarsiz",c:"#f87171"};
const parseF=s=>{const t=s.trim();if(t.includes("/")){const[a,b]=t.split("/").map(Number);if(!isNaN(a)&&!isNaN(b)&&b>0)return Math.min(100,Math.round(a/b*100));}const n=Number(t);return(!isNaN(n)&&n>=0&&n<=100)?Math.round(n):null;};
const esc  =s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const ld   =k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const sv   =(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const fmt  =d=>d?d.slice(5):"";

// ══════════════════════════════════════════════════════
// SMART NAME MATCHING
// ══════════════════════════════════════════════════════
const CYR={'А':'A','а':'a','Б':'B','б':'b','В':'V','в':'v','Г':'G','г':'g','Д':'D','д':'d',
'Е':'E','е':'e','Ё':'YO','ё':'yo','Ж':'J','ж':'j','З':'Z','з':'z','И':'I','и':'i',
'Й':'Y','й':'y','К':'K','к':'k','Л':'L','л':'l','М':'M','м':'m','Н':'N','н':'n',
'О':'O','о':'o','П':'P','п':'p','Р':'R','р':'r','С':'S','с':'s','Т':'T','т':'t',
'У':'U','у':'u','Ф':'F','ф':'f','Х':'H','х':'h','Ч':'Ch','ч':'ch','Ш':'Sh','ш':'sh',
'Щ':'Sh','Ъ':'','ъ':'','Ы':'I','ы':'i','Ь':'','ь':'','Э':'E','э':'e',
'Ю':'YU','ю':'yu','Я':'YA','я':'ya','Ў':'O','ў':'o','Қ':'K','қ':'k','Ғ':'G','ғ':'g','Ҳ':'H','ҳ':'h'};
const DIG={'0':'o','1':'i','2':'z','3':'e','4':'a','5':'s','6':'b','7':'t','8':'b','9':'g'};

function nw(w){
  // Step 1: Cyrillic→Latin (multi-char: Ё→YO, Ю→YU, Я→YA, Ч→CH, Ш→SH first)
  let r='';
  const up=w.trim().toUpperCase();
  for(let i=0;i<up.length;i++){
    const c=up[i];
    if(CYR[up[i]]!==undefined){r+=CYR[up[i]];}
    else{r+=c;}
  }
  r=r.toLowerCase();
  // Step 2: digit→letter
  r=[...r].map(c=>DIG[c]||c).join('');
  // Step 3: remove all apostrophe variants and special chars
  r=r.replace(/['\u2018\u2019\u02bc\u02bb\uff07`ʼʻʽ"$@#!]/g,'');
  // Step 4: normalize x→h only (q→k removed: too aggressive)
  r=r.replace(/x/g,'h');
  // Step 5: collapse duplicate consecutive chars
  r=r.replace(/(.)\1+/g,'$1');
  return r;
}
const nn=name=>nw((name||'').replace(/\s+/g,''));

function lev(a,b){
  if(a===b)return 0;if(a.length<b.length)[a,b]=[b,a];
  let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=0;i<a.length;i++){const c=[i+1];for(let j=0;j<b.length;j++)c.push(Math.min(p[j]+(a[i]!==b[j]?1:0),c[j]+1,p[j+1]+1));p=c;}
  return p[b.length];
}

// Word similarity — length-based strict threshold
// Short words (≤5): must be exact. Medium (6-8): max 1 edit. Long (9+): max 2 edits.
function wSim(a,b){
  if(a===b)return 1;
  const d=lev(a,b),m=Math.max(a.length,b.length,1);
  const maxEdit=m<=5?0:m<=8?1:2;
  if(d>maxEdit)return 0;
  return 1-d/m;
}

// Split full name into [surname, firstname] parts
function splitName(name){
  const parts=(name||'').trim().split(/\s+/).map(nw).filter(Boolean);
  return parts;
}

// Guruh normalizatsiya: '4 класс'→'4', '4 class'→'4', 'Вариант 1'→'variant1'
function normGuruh(g){
  const s=(g||'').toLowerCase().trim();
  if(/klas|class|клас/i.test(s)){const n=s.match(/\d+/);return n?n[0]:'';}
  return nw(s);
}

// Tartib: 1) Ism+Familiya → 2) Filial → 3) Sinf
function samePerson(s1,s2){
  const n1=s1.name||'',n2=s2.name||'';
  const gn1=normGuruh(s1.guruh||''),gn2=normGuruh(s2.guruh||'');
  const bothHaveGuruh=!!gn1&&!!gn2;

  // ── 1. ISM + FAMILIYA ──────────────────────────────
  const nameOk=(()=>{
    if(nn(n1)===nn(n2)) return true;
    const w1=splitName(n1),w2=splitName(n2);
    if(!w1.length||!w2.length) return false;
    const isPrefix=(a,b)=>!bothHaveGuruh&&a.length>0&&b.length>0&&(b.startsWith(a)||a.startsWith(b));
    const match=(sA,fA,sB,fB)=>{
      if(wSim(sA,sB)<0.80) return false;
      if(!fA||!fB) return false;
      return isPrefix(fA,fB)||wSim(fA,fB)>=0.80;
    };
    const s1n=w1[0],f1n=w1.slice(1).join('');
    const s2n=w2[0],f2n=w2.slice(1).join('');
    if(match(s1n,f1n,s2n,f2n)) return true;
    if(w1.length>=2&&w2.length>=2){
      const s1r=w1[w1.length-1],f1r=w1.slice(0,-1).join('');
      const s2r=w2[w2.length-1],f2r=w2.slice(0,-1).join('');
      if(match(s1r,f1r,s2n,f2n)) return true;
      if(match(s1n,f1n,s2r,f2r)) return true;
      if(match(s1r,f1r,s2r,f2r)) return true;
    }
    return false;
  })();
  if(!nameOk) return false;

  // ── 2. FILIAL ──────────────────────────────────────
  const fn1=nn(s1.filial||''),fn2=nn(s2.filial||'');
  if(fn1&&fn2&&fn1!==fn2) return false;

  // ── 3. SINF ────────────────────────────────────────
  if(gn1&&gn2&&gn1!==gn2) return false;

  return true;
}

// ══════════════════════════════════════════════════════
// CSV / HTML PARSERS
// ══════════════════════════════════════════════════════
function splitCSV(line){
  const r=[];let cur="",inQ=false;
  for(const c of line){if(c==='"'){inQ=!inQ;continue;}if(c===','&&!inQ){r.push(cur);cur="";continue;}cur+=c;}
  r.push(cur);return r;
}

function detectCols(lines){
  const cols={nameCol:1,filialCol:2,guruhCol:3,sub1F:5,sub2F:7,jamiF:8,sub2:"muammo",date:"",merged:false};
  if(!lines.length)return cols;
  const r0=splitCSV(lines[0]).map(c=>c.toLowerCase().trim());
  if(r0[0]==="ism"||r0[0]==="name"){
    cols.merged=true;
    cols.nameCol  =r0.findIndex(c=>c==="ism"||c==="name");
    cols.filialCol=r0.findIndex(c=>c.includes("filial"));
    cols.guruhCol =r0.findIndex(c=>c.includes("guruh")||c.includes("sinf"));
    cols.dateCol  =r0.findIndex(c=>c.includes("sana")||c.includes("date"));
    cols.sub1F    =r0.findIndex(c=>c.includes("matematik"));
    cols.inglizC  =r0.findIndex(c=>c.includes("ingliz"));
    cols.muammoC  =r0.findIndex(c=>c.includes("muam"));
    cols.jamiF    =r0.findIndex(c=>c.includes("jami"));
    return cols;
  }
  const dm=lines[0].match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(dm)cols.date=`${dm[3]}-${dm[2]}-${dm[1]}`;
  if(lines.length>1){const r1=lines[1].toLowerCase();cols.sub2=(r1.includes("ingliz")||r1.includes("англий"))?"ingliz":"muammo";}
  return cols;
}

function parseCSV(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const res=[];if(lines.length<2)return res;
  const C=detectCols(lines);
  const gf=(c,idx)=>{if(idx<0||idx>=c.length)return 0;return Math.min(100,Math.max(0,parseFloat((c[idx]||"0").replace(",","."))||0));};
  if(C.merged){
    for(let i=1;i<lines.length;i++){
      const c=splitCSV(lines[i]);const name=(c[C.nameCol]||"").trim();if(!name)continue;
      const filial=(c[C.filialCol]||"").trim();
      if(!filial)continue; // skip if no filial
      res.push({name,filial,guruh:(c[C.guruhCol]||"").trim(),
        mathF:gf(c,C.sub1F),inglizF:gf(c,C.inglizC),muammoF:gf(c,C.muammoC),jamiF:gf(c,C.jamiF),
        date:C.dateCol>=0?(c[C.dateCol]||"").trim():C.date});
    }
    return res;
  }
  for(let i=3;i<lines.length;i++){
    const c=splitCSV(lines[i]);const name=(c[C.nameCol]||"").trim();if(!name)continue;
    const filial=(c[C.filialCol]||"").trim();
    if(!filial)continue; // skip if no filial
    const mF=gf(c,C.sub1F),s2F=gf(c,C.sub2F),jF=gf(c,C.jamiF);
    if(mF===0&&s2F===0&&jF===0)continue;
    res.push({name,filial,guruh:(c[C.guruhCol]||"").trim(),
      mathF:mF,inglizF:C.sub2==="ingliz"?s2F:0,muammoF:C.sub2==="muammo"?s2F:0,jamiF:jF,date:C.date});
  }
  return res;
}

function parseHTML(html){
  const rows=[];
  const trRe=/<tr[^>]*>([\s\S]*?)<\/tr>/gi;const tagRe=/<[^>]+>/g;
  let tm;
  while((tm=trRe.exec(html))!==null){
    const cells=[];let td;const r2=/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi;
    while((td=r2.exec(tm[1]))!==null){
      cells.push(td[1].replace(tagRe,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&')
        .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;/g,"'").trim());
    }
    if(cells.length)rows.push(cells);
  }
  if(rows.length<4)return[];
  let date="";const dm=[...rows.slice(0,3)].join(" ").match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(dm)date=`${dm[3]}-${dm[2]}-${dm[1]}`;
  const sub2=[...rows.slice(0,4)].join(" ").toLowerCase().includes("ingliz")?"ingliz":"muammo";
  const res=[];
  for(let i=4;i<rows.length;i++){
    const r=rows[i];const name=(r[2]||"").trim();
    if(!name||/^\d+$/.test(name)||name.toLowerCase().includes("smena")||name.length<3)continue;
    const filial=(r[3]||"").trim();
    if(!filial)continue; // skip no filial
    const gf=idx=>idx<r.length?Math.min(100,Math.max(0,parseFloat((r[idx]||"0").replace(",","."))||0)):0;
    const mF=gf(6),s2F=gf(8),jF=gf(9);
    if(mF===0&&s2F===0)continue;
    res.push({name,filial,guruh:(r[4]||"").trim(),
      mathF:mF,inglizF:sub2==="ingliz"?s2F:0,muammoF:sub2==="muammo"?s2F:0,jamiF:jF,date});
  }
  return res;
}

// ══════════════════════════════════════════════════════
// MERGE (smart matching with filial+guruh rules)
// ══════════════════════════════════════════════════════
function merge(rows,students,sessionDate){
  const res=students.map(s=>({...s,scores:s.scores.map(a=>[...a]),days:(s.days||[[],[],[]]).map(a=>[...a])}));
  let added=0,updated=0;
  const skipped=[];  // {name, filial, reason}
  const merged_dupes=[];

  for(const row of rows){
    const d=sessionDate||row.date||"";

    // Find matching existing student
    const idx=res.findIndex(s=>samePerson(
      {name:s.name,filial:s.filial||"",guruh:s.guruh||""},
      {name:row.name,filial:row.filial,guruh:row.guruh}
    ));

    if(idx>=0){
      const s=res[idx];const dy=s.days||[[],[],[]];
      if(row.mathF>0){s.scores[0].push(row.mathF);dy[0].push(d);}
      if(row.inglizF>0){s.scores[1].push(row.inglizF);dy[1].push(d);}
      if(row.muammoF>0){s.scores[2].push(row.muammoF);dy[2].push(d);}
      s.days=dy;res[idx]=s;updated++;
      // Track if name was different (merged)
      if(nn(s.name)!==nn(row.name))merged_dupes.push([row.name,s.name]);
    } else {
      // New student — guruh required
      if(!row.guruh){
        skipped.push({name:row.name,filial:row.filial,reason:"sinf yo'q"});
        continue;
      }
      const sc=[[],[],[]],dy=[[],[],[]];
      if(row.mathF>0){sc[0].push(row.mathF);dy[0].push(d);}
      if(row.inglizF>0){sc[1].push(row.inglizF);dy[1].push(d);}
      if(row.muammoF>0){sc[2].push(row.muammoF);dy[2].push(d);}
      res.push({id:uid(),name:row.name,filial:row.filial,guruh:row.guruh,scores:sc,days:dy});
      added++;
    }
  }
  return{students:res,added,updated,skipped,merged_dupes};
}

// ══════════════════════════════════════════════════════
// SVG CHART
// ══════════════════════════════════════════════════════
function mkSVG(scores,days){
  if(!scores||!scores.length)return`<div style="color:#2a2a45;text-align:center;padding:18px 0;font-size:11px">Ma'lumot yo'q</div>`;
  const W=300,H=110,PL=34,PB=22,PT=16,PR=8,cW=W-PL-PR,cH=H-PB-PT;
  const pts=scores.map((v,i)=>({x:PL+(i/Math.max(scores.length-1,1))*cW,y:PT+cH-(v/100)*cH,v}));
  const poly=pts.map(p=>`${p.x},${p.y}`).join(" ");
  const area=`${pts[0].x},${PT+cH} ${poly} ${pts[pts.length-1].x},${PT+cH}`;
  const grow=scores.length>1&&scores[scores.length-1]>=scores[0];
  const diff=scores.length>1?Math.round((scores[scores.length-1]-scores[0])/Math.max(scores[0],1)*100):0;
  const lc=grow?"#34d399":"#f87171",fc=grow?"#34d39918":"#f8717118";
  const grids=[0,25,50,75,100].map(s=>{const y=PT+cH-(s/100)*cH;return`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#1e1e33" stroke-width="1"/><text x="${PL-4}" y="${y+4}" fill="#3a3a5a" font-size="8" text-anchor="end">${s}</text>`;}).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${lc}"/><text x="${p.x}" y="${p.y-6}" fill="${lc}" font-size="7" text-anchor="middle">${p.v}%</text><text x="${p.x}" y="${H-3}" fill="#3a3a5a" font-size="7" text-anchor="middle">${days&&days[i]?days[i]:i+1}</text>`).join("");
  return`<div style="display:flex;justify-content:flex-end;margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${lc};background:${lc}22;padding:2px 8px;border-radius:20px">${diff>0?"▲":diff<0?"▼":"—"} ${Math.abs(diff)}%</span></div><svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">${grids}<polygon points="${area}" fill="${fc}"/><polyline points="${poly}" fill="none" stroke="${lc}" stroke-width="2" stroke-linejoin="round"/>${dots}<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+cH}" stroke="#2a2a45" stroke-width="1"/></svg>`;
}

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
const S={
  teacher:ld("st_teacher")||"Ustoz",lang:ld("st_lang")||"uz",
  students:ld("st_students")||[],
  search:"",openFilial:null, // accordion: which filial is open
  sortBy:"jami",sortAsc:false,
  page:"list",active:null,editIdx:null,
  csvLoading:false,csvErr:"",importUrl:ld("st_importUrl")||"",
  selected:[],selectMode:false,
  importReport:null,
  tab:"list",
};
const set=(p,nr)=>{Object.assign(S,p);if(!nr)render();};

let BUF={entries:[],name:"",teacher:"",editScore:"",editDate:"",importUrl:""};
function resetBuf(){BUF={entries:[{id:uid(),si:0,score:"",date:""}],name:"",teacher:S.teacher,editScore:"",editDate:"",importUrl:S.importUrl};}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function render(){
  let overlay="";
  if(S.page==="addStudent") overlay=renderAddSheet();
  else if(S.page==="addScore")     overlay=renderScoreSheet();
  else if(S.page==="detail")       overlay=renderDetail();
  else if(S.page==="editName")     overlay=renderEditName();
  else if(S.page==="delConfirm")   overlay=renderDelConfirm();
  else if(S.page==="editTeacher")  overlay=renderTeacher();
  else if(S.page==="import")       overlay=renderImport();
  else if(S.page==="importReport") overlay=renderImportReport();
  document.getElementById("root").innerHTML=
    renderHeader()+renderStatsBar()+renderSearch()+
    (S.tab==="stats"?renderFilialStats():`<div style="padding:10px 12px 40px">${renderAccordion()}</div>`)+
    overlay;
}

// ── Header ────────────────────────────────────────────
function renderHeader(){
  const ini=S.teacher.trim()?S.teacher.trim()[0].toUpperCase():"U";
  return`<div style="background:linear-gradient(135deg,#0d0d1f,#12122a);border-bottom:1px solid #1a1a30;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100">

// ── Accordion filial list ─────────────────────────────
function getFiltered(filialFilter){
  let fl=S.students.filter(s=>
    s.name.toLowerCase().includes(S.search.toLowerCase())||
    (s.filial||"").toLowerCase().includes(S.search.toLowerCase())||
    (s.guruh||"").toLowerCase().includes(S.search.toLowerCase())
  );
  if(filialFilter&&filialFilter!=="Barchasi") fl=fl.filter(s=>s.filial===filialFilter);
  fl.sort((a,b)=>{
    if(S.sortBy==="ism")return S.sortAsc?a.name.localeCompare(b.name):b.name.localeCompare(a.name);
    const va=S.sortBy==="math"?avg(a.scores[0]):S.sortBy==="ingliz"?avg(a.scores[1]):S.sortBy==="muammo"?avg(a.scores[2]):ovAvg(a);
    const vb=S.sortBy==="math"?avg(b.scores[0]):S.sortBy==="ingliz"?avg(b.scores[1]):S.sortBy==="muammo"?avg(b.scores[2]):ovAvg(b);
    return S.sortAsc?va-vb:vb-va;
  });
  return fl;
}

// ══════════════════════════════════════════════════════
// FILE HANDLING
// ══════════════════════════════════════════════════════
function processRows(rows,sessionDate){
  if(!rows.length){set({csvErr:"Ma'lumot topilmadi",csvLoading:false});return;}
  const{students,added,updated,skipped,merged_dupes}=merge(rows,S.students,sessionDate);
  sv("st_students",students);
  set({students,page:"importReport",csvLoading:false,csvErr:"",
    importReport:{added,updated,skipped,merged_dupes}});
}

document.getElementById("fileInp").addEventListener("change",function(e){
  const file=e.target.files[0];if(!file)return;
  const isHTML=file.name.toLowerCase().endsWith('.html')||file.name.toLowerCase().endsWith('.htm');
  const reader=new FileReader();
  reader.onload=ev=>{
    const rows=isHTML?parseHTML(ev.target.result):parseCSV(ev.target.result);
    processRows(rows,"");
  };
  reader.readAsText(file,"UTF-8");
  e.target.value="";
});

async function loadLink(){
  const url=(BUF.importUrl||document.getElementById("urlInp")?.value||"").trim();
  if(!url){set({csvErr:"Link kiriting"});return;}
  sv("st_importUrl",url);set({csvLoading:true,csvErr:"",importUrl:url});
  try{
    const idM=url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    const gidM=url.match(/[?&]gid=(\d+)/);
    let csvUrl=url;
    if(idM){const gid=gidM?gidM[1]:"0";csvUrl=`https://docs.google.com/spreadsheets/d/${idM[1]}/export?format=csv&gid=${gid}`;}
    const res=await fetch(csvUrl);
    if(!res.ok)throw new Error("Server: "+res.status);
    const rows=parseCSV(await res.text());
    processRows(rows,document.getElementById("dateInp")?.value||"");
  }catch(e){set({csvErr:"Xatolik: "+e.message,csvLoading:false});}
}

// ══════════════════════════════════════════════════════
// LIVE UPDATES
// ══════════════════════════════════════════════════════
function liveScore(id,val){const en=BUF.entries.find(e=>e.id===id);if(!en)return;en.score=val;const p=parseF(val),el=document.getElementById(`prev_${id}`);if(el)el.textContent=(p!==null&&val.trim())?`→ ${p}% (${grade(p).l})`:"";;}
function liveDate(id,val){const en=BUF.entries.find(e=>e.id===id);if(en)en.date=val;}
function liveES(val){BUF.editScore=val;const p=parseF(val),el=document.getElementById("ePrev");if(el)el.textContent=(p!==null&&val.trim())?`→ ${p}% (${grade(p).l})`:"";;}
function refreshEL(){const el=document.getElementById("entryList");if(el)el.innerHTML=entryRows();}
function addE(){BUF.entries.push({id:uid(),si:0,score:"",date:""});refreshEL();}
function rmE(id){if(BUF.entries.length<2)return;BUF.entries=BUF.entries.filter(e=>e.id!==id);refreshEL();}
function pickSi(id,si){const en=BUF.entries.find(e=>e.id===id);if(en){en.si=Number(si);refreshEL();}}

// ══════════════════════════════════════════════════════
// NAVIGATION & ACTIONS
// ══════════════════════════════════════════════════════
function back(){resetBuf();set({page:"list",active:null,editIdx:null,csvLoading:false,csvErr:""});}
function go(page){resetBuf();set({page});}
function toggleLang(){const l=S.lang==="uz"?"ru":"uz";sv("st_lang",l);set({lang:l});}
function doSearch(v){S.search=v;render();}
function doSort(k){if(S.sortBy===k)set({sortAsc:!S.sortAsc});else set({sortBy:k,sortAsc:false});}

// Accordion
function toggleAcc(f){set({openFilial:S.openFilial===f?null:f});}

function openDet(id){const s=S.students.find(x=>x.id===id);if(s){resetBuf();set({page:"detail",active:{...s},editIdx:null});}}
function openScore(id){const s=S.students.find(x=>x.id===id);if(s){resetBuf();set({page:"addScore",active:s});}}
function editN(id){const s=S.students.find(x=>x.id===id);if(s){resetBuf();BUF.name=s.name;set({page:"editName",active:s});}}
function delC(id){const s=S.students.find(x=>x.id===id);if(s)set({page:"delConfirm",active:s});}

function toggleSM(){set({selectMode:!S.selectMode,selected:[]});}
function toggleSel(id){const sel=S.selected.includes(id)?S.selected.filter(x=>x!==id):[...S.selected,id];set({selected:sel});}
function selAll(){const fl=getFiltered(S.openFilial);const all=fl.map(s=>s.id);set({selected:S.selected.length===all.length?[]:all});}
function bulkDel(){if(!S.selected.length)return;if(!confirm(`${S.selected.length} ta o'quvchi o'chirilsinmi?`))return;const all=S.students.filter(s=>!S.selected.includes(s.id));sv("st_students",all);set({students:all,selected:[],selectMode:false});}

function saveStudent(){
  const name=(BUF.name||document.getElementById("nameInp")?.value||"").trim();
  if(!name){showErr("addErr","Ism kiriting");return;}
  const sc=[[],[],[]],dy=[[],[],[]];
  for(const en of BUF.entries){if(!en.score.trim())continue;const p=parseF(en.score);if(p===null){showErr("addErr",`"${en.score}" noto'g'ri`);return;}sc[en.si].push(p);dy[en.si].push(en.date||"");}
  const ns=[...S.students,{id:uid(),name,scores:sc,days:dy}];
  sv("st_students",ns);resetBuf();set({students:ns,page:"list"});
}
function saveScore(){
  const s=S.active;if(!s)return;
  const ns=[[],[],[]],nd=[[],[],[]];
  for(const en of BUF.entries){if(!en.score.trim())continue;const p=parseF(en.score);if(p===null){showErr("addErr",`"${en.score}" noto'g'ri`);return;}ns[en.si].push(p);nd[en.si].push(en.date||"");}
  const dy=s.days||[[],[],[]];
  const upd={...s,scores:s.scores.map((a,i)=>[...a,...ns[i]]),days:dy.map((a,i)=>[...a,...nd[i]])};
  const all=S.students.map(x=>x.id===upd.id?upd:x);
  sv("st_students",all);resetBuf();set({students:all,page:"list",active:null});
}
function doEN(){
  const name=(BUF.name||document.getElementById("eNI")?.value||"").trim();if(!name)return;
  const all=S.students.map(x=>x.id===S.active.id?{...x,name}:x);
  sv("st_students",all);resetBuf();set({students:all,page:"list",active:null});
}
function doDel(){const all=S.students.filter(x=>x.id!==S.active.id);sv("st_students",all);set({students:all,page:"list",active:null});}
function doST(){const name=(BUF.teacher||document.getElementById("tInp")?.value||"").trim()||"Ustoz";sv("st_teacher",name);resetBuf();set({teacher:name,page:"list"});}

function startE(si,idx,v,d){BUF.editScore=String(v);BUF.editDate=d;set({editIdx:{si:Number(si),idx:Number(idx)}});}
function cancelE(){BUF.editScore="";BUF.editDate="";set({editIdx:null});}
function saveEE(si,idx){
  const val=BUF.editScore||document.getElementById("eSI")?.value||"";
  const date=BUF.editDate||document.getElementById("eDI")?.value||"";
  const p=parseF(val);if(p===null){const el=document.getElementById("eErr");if(el){el.style.display="block";el.textContent="Noto'g'ri format";}return;}
  const s=S.active;
  const newSc=s.scores.map((arr,i)=>i==si?arr.map((v,j)=>j==idx?p:v):arr);
  const newDy=(s.days||[[],[],[]]).map((arr,i)=>i==si?arr.map((v,j)=>j==idx?date:v):arr);
  const upd={...s,scores:newSc,days:newDy};
  const all=S.students.map(x=>x.id===upd.id?upd:x);
  sv("st_students",all);BUF.editScore="";BUF.editDate="";set({students:all,active:upd,editIdx:null});
}
function delE(si,idx){
  const s=S.active;
  const newSc=s.scores.map((arr,i)=>i==si?arr.filter((_,j)=>j!=idx):arr);
  const newDy=(s.days||[[],[],[]]).map((arr,i)=>i==si?arr.filter((_,j)=>j!=idx):arr);
  const upd={...s,scores:newSc,days:newDy};
  const all=S.students.map(x=>x.id===upd.id?upd:x);
  sv("st_students",all);set({students:all,active:upd,editIdx:null});
}
function showErr(id,msg){const el=document.getElementById(id);if(el){el.style.display="block";el.textContent=msg;}}

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
resetBuf();render();
</script>
