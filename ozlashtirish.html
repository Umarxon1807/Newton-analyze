// SMART NAME MATCHING
// ═══════════════════════════════════════════════════════════
const CYR={'А':'A','а':'a','Б':'B','б':'b','В':'V','в':'v','Г':'G','г':'g','Д':'D','д':'d','Е':'E','е':'e','Ё':'YO','ё':'yo','Ж':'J','ж':'j','З':'Z','з':'z','И':'I','и':'i','Й':'Y','й':'y','К':'K','к':'k','Л':'L','л':'l','М':'M','м':'m','Н':'N','н':'n','О':'O','о':'o','П':'P','п':'p','Р':'R','р':'r','С':'S','с':'s','Т':'T','т':'t','У':'U','у':'u','Ф':'F','ф':'f','Х':'H','х':'h','Ч':'Ch','ч':'ch','Ш':'Sh','ш':'sh','Щ':'Sh','Ъ':'','ъ':'','Ы':'I','ы':'i','Ь':'','ь':'','Э':'E','э':'e','Ю':'YU','ю':'yu','Я':'YA','я':'ya','Ў':'O','ў':'o','Қ':'K','қ':'k','Ғ':'G','ғ':'g','Ҳ':'H','ҳ':'h'};
const DIG={'0':'o','1':'i','2':'z','3':'e','4':'a','5':'s','6':'b','7':'t','8':'b','9':'g'};

function nw(w){
  let r=''.concat(...w.trim().toUpperCase()).split('').map(c=>CYR[c]!==undefined?CYR[c]:c).join('').toLowerCase();
  r=[...r].map(c=>DIG[c]||c).join('');
  r=r.replace(/['\u2018\u2019\u02bc\u02bb`\u02bcʼʻʽ"$@#!]/g,'');
  r=r.replace(/x/g,'h').replace(/o['`\u02bc]/g,'o').replace(/g['`\u02bc]/g,'g');
  r=r.replace(/(.)\1+/g,'$1');
  return r;
}
const nn=name=>nw((name||'').replace(/\s+/g,''));

// FIX #1: normGuruh — was missing, caused ReferenceError
function normGuruh(g){
  const s=(g||'').toLowerCase().trim();
  if(/klas|class|клас/i.test(s)){const n=s.match(/\d+/);return n?n[0]:'';}
  return nw(s);
}

function lev(a,b){
  if(a===b)return 0;if(a.length<b.length)[a,b]=[b,a];
  let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=0;i<a.length;i++){const c=[i+1];for(let j=0;j<b.length;j++)c.push(Math.min(p[j]+(a[i]!==b[j]?1:0),c[j]+1,p[j+1]+1));p=c;}
  return p[b.length];
}
function wSim(a,b){if(a===b)return 1;const d=lev(a,b),m=Math.max(a.length,b.length,1),t=m>=6?1:0;return d>t?0:1-d/m;}
const splitName=name=>(name||'').trim().split(/\s+/).map(nw).filter(Boolean);
const pfx=(a,b)=>a&&b&&(b.startsWith(a)||a.startsWith(b));

function samePerson(s1,s2){
  const f1=nn(s1.filial||''),f2=nn(s2.filial||'');
  if(f1&&f2&&f1!==f2)return false;
  if(nn(s1.name)===nn(s2.name))return true;
  const w1=splitName(s1.name),w2=splitName(s2.name);
  if(!w1.length||!w2.length)return false;
  const match=(sA,fA,sB,fB)=>{
    if(wSim(sA,sB)<0.80)return false;
    if(!fA||!fB)return true;
    return pfx(fA,fB)||wSim(fA,fB)>=0.80;
  };
  const s1n=w1[0],f1n=w1.slice(1).join(''),s2n=w2[0],f2n=w2.slice(1).join('');
  if(match(s1n,f1n,s2n,f2n))return true;
  if(w1.length>=2&&w2.length>=2){
    const s1r=w1[w1.length-1],f1r=w1.slice(0,-1).join('');
    const s2r=w2[w2.length-1],f2r=w2.slice(0,-1).join('');
    if(match(s1r,f1r,s2n,f2n)||match(s1n,f1n,s2r,f2r)||match(s1r,f1r,s2r,f2r))return true;
  }
  return false;
}

// AUTH — FIX #4,#5: hash not in code, no keyPlain stored

async function hashPass(pass){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pass));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkKey(key){
  const h=await hashPass(key);
  // 1. Firestore dan admin hash tekshir

    const cfg=await _db.collection("config").doc("admin").get();
    if(cfg.exists&&cfg.data().hash&&cfg.data().hash===h)return{role:"admin",name:"Admin"};

  if(h===DEFAULT_ADMIN_HASH)return{role:"admin",name:"Admin"};

  return null;
}

// Activity log
async function logActivity(action,details=""){
  if(!canEdit())return;
  try{
    const now=new Date();
    const dk=now.toISOString().slice(0,10);
    await _db.collection("logs").doc(dk).collection("entries").add({
      who:AUTH.name||AUTH.role,role:AUTH.role,action,details,
      ts:Date.now(),time:now.toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"})
    });
    // Delete entries older than 3 days
    for(let i=3;i<=5;i++){
      const old=new Date(Date.now()-i*864e5).toISOString().slice(0,10);
      try{
        const s=await _db.collection("logs").doc(old).collection("entries").limit(1).get();
        if(!s.empty){
          const all=await _db.collection("logs").doc(old).collection("entries").get();
          const batch=_db.batch();all.docs.forEach(d=>batch.delete(d.ref));await batch.commit();
        }
      }catch{}
    }
  }catch(e){console.warn("Log:",e);}
}

function splitCSV(line){const r=[];let cur="",inQ=false;for(const c of line){if(c==='"'){inQ=!inQ;continue;}if(c===','&&!inQ){r.push(cur);cur="";continue;}cur+=c;}r.push(cur);return r;}

  const r0=splitCSV(lines[0]).map(c=>c.toLowerCase().trim());
  if(r0[0]==="ism"||r0[0]==="name"){
    cols.merged=true;
    cols.nameCol  =r0.findIndex(c=>c==="ism"||c==="name");
    cols.filialCol=r0.findIndex(c=>c.includes("filial"));
    cols.guruhCol =r0.findIndex(c=>c.includes("guruh")||c.includes("sinf"));
    cols.dateCol  =r0.findIndex(c=>c.includes("sana")||c.includes("date"));
    cols.sub1F    =r0.findIndex(c=>c.includes("matematik"));
    cols.inglizC  =r0.findIndex(c=>c.includes("ingliz"));
    cols.muammoC  =r0.findIndex(c=>c.includes("muam"));
    cols.jamiF    =r0.findIndex(c=>c.includes("jami"));
    return cols;
  }
  const dm=lines[0].match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(dm)cols.date=`${dm[3]}-${dm[2]}-${dm[1]}`;
  if(lines.length>1){const r1=lines[1].toLowerCase();cols.sub2=(r1.includes("ingliz")||r1.includes("англий"))?"ingliz":"muammo";}
  return cols;
}

function parseCSV(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const res=[];if(lines.length<2)return res;
  const C=detectCols(lines);
  const gf=(c,idx)=>{if(idx<0||idx>=c.length)return 0;return Math.min(100,Math.max(0,parseFloat((c[idx]||"0").replace(",","."))||0));};
  if(C.merged){
    for(let i=1;i<lines.length;i++){
      const c=splitCSV(lines[i]);const name=(c[C.nameCol]||"").trim();if(!name)continue;
      const filial=(c[C.filialCol]||"").trim();if(!filial)continue;
      res.push({name,filial,guruh:(c[C.guruhCol]||"").trim(),
        mathF:gf(c,C.sub1F),inglizF:gf(c,C.inglizC),muammoF:gf(c,C.muammoC),jamiF:gf(c,C.jamiF),
        date:C.dateCol>=0?(c[C.dateCol]||"").trim():C.date});
    }
    return res;
  }
  for(let i=3;i<lines.length;i++){
    const c=splitCSV(lines[i]);const name=(c[C.nameCol]||"").trim();if(!name)continue;
    const filial=(c[C.filialCol]||"").trim();if(!filial)continue;
    const mF=gf(c,C.sub1F),s2F=gf(c,C.sub2F),jF=gf(c,C.jamiF);
    if(mF===0&&s2F===0&&jF===0)continue;
    res.push({name,filial,guruh:(c[C.guruhCol]||"").trim(),
      mathF:mF,inglizF:C.sub2==="ingliz"?s2F:0,muammoF:C.sub2==="muammo"?s2F:0,jamiF:jF,date:C.date});
  }
  return res;
}

function parseHTML(html){
  const rows=[];const tagRe=/<[^>]+>/g;let tm;const trRe=/<tr[^>]*>([\s\S]*?)<\/tr>/gi;
  while((tm=trRe.exec(html))!==null){
    const cells=[];let td;const r2=/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi;
    while((td=r2.exec(tm[1]))!==null)cells.push(td[1].replace(tagRe,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;/g,"'").trim());
    if(cells.length)rows.push(cells);
  }
  if(rows.length<4)return[];
  let date="";const dm=[...rows.slice(0,3)].join(" ").match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(dm)date=`${dm[3]}-${dm[2]}-${dm[1]}`;
  const sub2=[...rows.slice(0,4)].join(" ").toLowerCase().includes("ingliz")?"ingliz":"muammo";
  const res=[];
  for(let i=4;i<rows.length;i++){
    const r=rows[i];const name=(r[2]||"").trim();
    if(!name||/^\d+$/.test(name)||name.toLowerCase().includes("smena")||name.length<3)continue;
    const filial=(r[3]||"").trim();if(!filial)continue;
    const gf=idx=>idx<r.length?Math.min(100,Math.max(0,parseFloat((r[idx]||"0").replace(",","."))||0)):0;
    const mF=gf(6),s2F=gf(8),jF=gf(9);
    if(mF===0&&s2F===0)continue;
    res.push({name,filial,guruh:(r[4]||"").trim(),
      mathF:mF,inglizF:sub2==="ingliz"?s2F:0,muammoF:sub2==="muammo"?s2F:0,jamiF:jF,date});
  }
  return res;
}

function parsePDFText(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const res=[];let date="";
  const dm=text.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(dm)date=`${dm[3]}-${dm[2]}-${dm[1]}`;
  let sub2="muammo";
  for(const l of lines.slice(0,5)){if(/ingliz|англий/i.test(l)){sub2="ingliz";break;}}
  const FILIALS=["Parkent","Rakat","Sergeli","Ganga","Chilonzor"];
  for(const line of lines){
    if(/f\.i\.o|filial|sinf|matematika|ingliz|muammo|natija/i.test(line)&&line.length<60)continue;
    const parts=line.split(/\s+/);
    if(!parts.length||!/^\d+$/.test(parts[0]))continue;
    const filialIdx=parts.findIndex(p=>FILIALS.some(f=>f.toLowerCase()===p.toLowerCase()));
    if(filialIdx<0)continue;
    const filial=parts[filialIdx];
    const nameParts=parts.slice(1,filialIdx);
    if(!nameParts.length)continue;
    const name=nameParts.join(' ').trim();if(name.length<3)continue;
    const lineAfter=parts.slice(filialIdx+1).join(' ');
    const gm=lineAfter.match(/(\d+)\s*(класс|klass|class)/i);
    const guruh=gm?`${gm[1]} класс`:"";
    const foizParts=parts.filter(p=>/^\d+[,\.]\d+$/.test(p)).map(p=>parseFloat(p.replace(',','.'))||0);
    const mathF=foizParts.length>=1?Math.min(100,Math.round(foizParts[0])):0;
    const sub2F=foizParts.length>=2?Math.min(100,Math.round(foizParts[1])):0;
    const jamiF=foizParts.length>=3?Math.min(100,Math.round(foizParts[foizParts.length-1])):0;
    if(mathF===0&&sub2F===0)continue;
    res.push({name,filial,guruh,date,mathF,inglizF:sub2==="ingliz"?sub2F:0,muammoF:sub2==="muammo"?sub2F:0,jamiF});
  }
  return res;
}

async function loadPDFjs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);};
    s.onerror=rej;document.head.appendChild(s);
  });
}

async function parsePDF(buf){
  const lib=await loadPDFjs();
  const pdf=await lib.getDocument({data:buf}).promise;
  let txt="";
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i);
    const ct=await pg.getTextContent();
    const items=ct.items.map(it=>({text:it.str,x:Math.round(it.transform[4]),y:Math.round(it.transform[5])}));
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    let ls=[],cy=null,cl=[];
    for(const it of items){
      if(cy===null||Math.abs(it.y-cy)>4){if(cl.length)ls.push(cl.map(x=>x.text).join(' '));cl=[it];cy=it.y;}
      else cl.push(it);
    }
    if(cl.length)ls.push(cl.map(x=>x.text).join(' '));
    txt+=ls.join('\n')+'\n';
  }
  return parsePDFText(txt);
}

function isSuspicious(n1,n2){
  const w1=splitName(n1),w2=splitName(n2);
  if(!w1.length||!w2.length)return false;
  if(w1.length===1||w2.length===1)return true;
  const f1=w1.slice(1).join(''),f2=w2.slice(1).join('');
  if(f1&&f2&&(f2.startsWith(f1)||f1.startsWith(f2))&&f1!==f2)return true;
  return false;
}

function merge(rows,students,sessionDate){
  const res=students.map(s=>({...s,scores:s.scores.map(a=>[...a]),days:(s.days||[[],[],[]]).map(a=>[...a])}));
  let added=0,updated=0;
  const skipped=[],merged_dupes=[],suspicious=[];
  const pendingRows=[];
  for(const row of rows){
    const d=sessionDate||row.date||"";
    const idx=res.findIndex(s=>samePerson({name:s.name,filial:s.filial||"",guruh:s.guruh||""},{name:row.name,filial:row.filial,guruh:row.guruh}));
    if(idx>=0){
      const s=res[idx];const dy=s.days||[[],[],[]];
      if(row.mathF>0){s.scores[0].push(row.mathF);dy[0].push(d);}
      if(row.inglizF>0){s.scores[1].push(row.inglizF);dy[1].push(d);}
      if(row.muammoF>0){s.scores[2].push(row.muammoF);dy[2].push(d);}
      s.days=dy;res[idx]=s;updated++;
      if(nn(s.name)!==nn(row.name)){merged_dupes.push([row.name,s.name]);if(isSuspicious(s.name,row.name))suspicious.push({row,existingName:s.name,date:d,merged:true});}
    } else {
      const suspIdx=res.findIndex(s=>{const fn1=nn(s.filial||''),fn2=nn(row.filial||'');if(fn1&&fn2&&fn1!==fn2)return false;const w1=splitName(s.name),w2=splitName(row.name);if(!w1.length||!w2.length)return false;return wSim(w1[0],w2[0])>=0.80;});
      if(suspIdx>=0&&isSuspicious(res[suspIdx].name,row.name)){
        suspicious.push({row,existingName:res[suspIdx].name,date:d,merged:false});
        pendingRows.push({row,d});continue;
      }
      if(!row.guruh){skipped.push({name:row.name,filial:row.filial});continue;}
      const sc=[[],[],[]],dy=[[],[],[]];
      if(row.mathF>0){sc[0].push(row.mathF);dy[0].push(d);}
      if(row.inglizF>0){sc[1].push(row.inglizF);dy[1].push(d);}
      if(row.muammoF>0){sc[2].push(row.muammoF);dy[2].push(d);}
      res.push({id:uid(),name:row.name,filial:row.filial,guruh:row.guruh,scores:sc,days:dy});added++;
    }
  }
  for(const {row,d} of pendingRows){
    const sc=[[],[],[]],dy=[[],[],[]];
    if(row.mathF>0){sc[0].push(row.mathF);dy[0].push(d);}
    if(row.inglizF>0){sc[1].push(row.inglizF);dy[1].push(d);}
    if(row.muammoF>0){sc[2].push(row.muammoF);dy[2].push(d);}
    res.push({id:uid(),name:row.name,filial:row.filial,guruh:row.guruh,scores:sc,days:dy,_pending:true});added++;
  }
  return{students:res,added,updated,skipped,merged_dupes,suspicious};
}

function mkSVG(scores,days){
  if(!scores||!scores.length)return`<div style="color:#2a2a45;text-align:center;padding:16px;font-size:11px">${t("noData")}</div>`;
  const W=300,H=110,PL=34,PB=22,PT=16,PR=8,cW=W-PL-PR,cH=H-PB-PT;
  const pts=scores.map((v,i)=>({x:PL+(i/Math.max(scores.length-1,1))*cW,y:PT+cH-(v/100)*cH,v}));
  const poly=pts.map(p=>`${p.x},${p.y}`).join(" ");
  const area=`${pts[0].x},${PT+cH} ${poly} ${pts[pts.length-1].x},${PT+cH}`;
  const grow=scores.length>1&&scores[scores.length-1]>=scores[0];
  const diff=scores.length>1?Math.round((scores[scores.length-1]-scores[0])/Math.max(scores[0],1)*100):0;
  const lc=grow?"#34d399":"#f87171",fc=grow?"#34d39918":"#f8717118";
  const grids=[0,25,50,75,100].map(s=>{const y=PT+cH-(s/100)*cH;return`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#1e1e33" stroke-width="1"/><text x="${PL-4}" y="${y+4}" fill="#3a3a5a" font-size="8" text-anchor="end">${s}</text>`;}).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${lc}"/><text x="${p.x}" y="${p.y-6}" fill="${lc}" font-size="7" text-anchor="middle">${p.v}%</text><text x="${p.x}" y="${H-3}" fill="#3a3a5a" font-size="7" text-anchor="middle">${days&&days[i]?days[i]:i+1}</text>`).join("");
  return`<div style="display:flex;justify-content:flex-end;margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${lc};background:${lc}22;padding:2px 8px;border-radius:20px">${diff>0?"▲":diff<0?"▼":"—"} ${Math.abs(diff)}%</span></div><svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">${grids}<polygon points="${area}" fill="${fc}"/><polyline points="${poly}" fill="none" stroke="${lc}" stroke-width="2" stroke-linejoin="round"/>${dots}<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+cH}" stroke="#2a2a45" stroke-width="1"/></svg>`;
}

function renderSearchDropdown(q){
  if(!q)return"";
  const ql=q.toLowerCase();
  const matches=S.students.filter(s=>s.name.toLowerCase().includes(ql)||(s.filial||"").toLowerCase().includes(ql)||(s.guruh||"").toLowerCase().includes(ql)).slice(0,8);
  if(!matches.length)return`<div style="background:#0b0b18;border:1.5px solid #a78bfa;border-top:none;border-radius:0 0 11px 11px;padding:10px 14px;font-size:12px;color:#3a3a5a">${t("noFound")}</div>`;
  return`<div style="background:#0b0b18;border:1.5px solid #a78bfa;border-top:none;border-radius:0 0 11px 11px;overflow:hidden;max-height:240px;overflow-y:auto">
    ${matches.map(s=>{
      const ov=ovAvg(s),g=grade(ov);
      const hi=s.name.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<b style="color:#a78bfa">$1</b>');
      return`<div onmousedown="event.preventDefault()" onclick="selectSearchResult('${s.id}')" style="padding:9px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid #1a1a2e">
        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;color:#e2e8f0">${hi}</div><div style="font-size:9px;color:#555">${esc(s.filial||"")}${s.guruh?" • "+esc(s.guruh):""}</div></div>
        <div style="font-size:14px;font-weight:900;color:${g.c};font-family:monospace">${ov}%</div>
      </div>`;
    }).join("")}
  </div>`;
}

// ── Accordion list ─────────────────────────────────────────
function getFiltered(f){
  let fl=S.students.filter(s=>s.name.toLowerCase().includes(S.search.toLowerCase())||(s.filial||"").toLowerCase().includes(S.search.toLowerCase())||(s.guruh||"").toLowerCase().includes(S.search.toLowerCase()));
  if(f&&f!=="Barchasi")fl=fl.filter(s=>s.filial===f);
  fl.sort((a,b)=>{
    if(S.sortBy==="ism")return S.sortAsc?a.name.localeCompare(b.name):b.name.localeCompare(a.name);
    const va=S.sortBy==="math"?avg(a.scores[0]):S.sortBy==="ingliz"?avg(a.scores[1]):S.sortBy==="muammo"?avg(a.scores[2]):ovAvg(a);
    const vb=S.sortBy==="math"?avg(b.scores[0]):S.sortBy==="ingliz"?avg(b.scores[1]):S.sortBy==="muammo"?avg(b.scores[2]):ovAvg(b);
    return S.sortAsc?va-vb:vb-va;
  });
  return fl;
}

  if(S.selectMode)return`<div onclick="toggleSel('${s.id}')" style="background:${isSel?"#1a0a0a":"#0f0f1a"};border:1.5px solid ${isSel?"#f87171":"#1a1a2e"};border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer">
    <div style="width:20px;height:20px;border-radius:5px;border:2px solid ${isSel?"#f87171":"#2a2a45"};background:${isSel?"#f87171":"transparent"};display:flex;align-items:center;justify-content:center;font-size:11px;color:#000">${isSel?"✓":""}</div>
    <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;color:${isSel?"#f87171":"#e2e8f0"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</div>${s.guruh?`<div style="font-size:9px;color:#555">${esc(s.guruh)}</div>`:""}</div>

  return`<div style="background:#0f0f1a;border:1.5px solid #1a1a2e;border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:7px;margin-bottom:6px">

    ${canEdit()?`<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
      <div class="iBtn" onclick="editN('${s.id}')" style="background:#4f46e522;border-color:#4f46e555">✏️</div>

function renderAccordion(){
  if(!S.students.length)return`<div style="text-align:center;color:#2a2a45;padding:40px 0;font-size:13px">${t("noStudents")}</div>`;
  if(S.openPanel!=="filiallar"&&!S.openFilial&&!S.search)return`<div style="text-align:center;color:#3a3a5a;padding:18px 0;font-size:12px">${t("pressFilial")}</div>`;
  const filials=["Barchasi",...new Set(S.students.map(s=>s.filial).filter(Boolean))].sort((a,b)=>a==="Barchasi"?-1:a.localeCompare(b));
  return filials.map(f=>{
    const isOpen=S.openFilial===f;
    const fl=getFiltered(f);
    const n=fl.length,oravg=n?Math.round(fl.reduce((s,x)=>s+ovAvg(x),0)/n):0;

    return`<div style="margin-bottom:7px">
      <div onclick="toggleAcc('${f}')" style="background:${isOpen?"#12122a":"#0f0f1a"};border:1.5px solid ${isOpen?"#a78bfa":"#1a1a2e"};border-radius:${isOpen?"11px 11px 0 0":"11px"};padding:10px 13px;display:flex;align-items:center;gap:8px;cursor:pointer">
        <div style="font-size:13px;font-weight:900;color:${isOpen?"#a78bfa":"#e2e8f0"};flex:1">${f==="Barchasi"?t("allFilials"):esc(f)}</div>
        <div style="font-size:10px;color:#555;font-family:monospace">${n} ta</div>

// ── Filial stats ────────────────────────────────────────────
function renderFilialStats(){
  const filials=[...new Set(S.students.map(s=>s.filial).filter(Boolean))].sort();
  if(!filials.length)return`<div style="text-align:center;color:#2a2a45;padding:40px;font-size:12px">CSV yuklagandan so'ng ko'rinadi</div>`;
  return`<div style="padding:8px 12px 40px">${filials.map(f=>{
    const fl=S.students.filter(s=>s.filial===f),n=fl.length,avgs=fl.map(s=>ovAvg(s));
    const oravg=n?Math.round(avgs.reduce((a,b)=>a+b,0)/n):0;
    const g=grade(oravg),alo=avgs.filter(v=>v>=85).length,yax=avgs.filter(v=>v>=70&&v<85).length,past=avgs.filter(v=>v>0&&v<55).length;
    const top3=[...fl].sort((a,b)=>ovAvg(b)-ovAvg(a)).slice(0,3);
    return`<div style="background:#0f0f1a;border:1.5px solid #1a1a2e;border-radius:14px;padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:14px;font-weight:900;color:#e2e8f0">${esc(f)}</div>
        <div style="text-align:right"><div style="font-size:20px;font-weight:900;color:${g.c};font-family:monospace">${oravg}%</div><div style="font-size:9px;color:${g.c};background:${g.c}22;border-radius:5px;padding:1px 6px">${g.l}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px">
        ${[[t("total"),n,"#a78bfa"],[t("excellent"),alo,"#34d399"],[t("good"),yax,"#60a5fa"],[t("low"),past,"#f87171"]].map(([l,v,c])=>`<div style="background:#07070f;border:1px solid ${c}33;border-radius:7px;padding:5px 3px;text-align:center"><div style="font-size:14px;font-weight:900;color:${c};font-family:monospace">${v}</div><div style="font-size:7px;color:#555">${l}</div></div>`).join("")}
      </div>
      <div style="font-size:9px;color:#555;margin-bottom:4px">${t("top3")}</div>
      ${top3.map((s,i)=>{const ov=ovAvg(s),gc=grade(ov);return`<div style="display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid #1a1a2e"><span style="font-size:10px;font-weight:900;color:${["#fbbf24","#94a3b8","#cd7f32"][i]};width:14px">${i+1}</span><span style="flex:1;font-size:11px;color:#e2e8f0">${esc(s.name)}</span><span style="font-size:11px;font-weight:700;color:${gc.c};font-family:monospace">${ov}%</span></div>`;}).join("")}
    </div>`;
  }).join("")}</div>`;
}

// ── Detail modal ────────────────────────────────────────────
function renderDetail(){
  const s=S.active;if(!s)return"";
  const ov=ovAvg(s),g=grade(ov);
  const blocks=SUBJ().map((subj,si)=>{
    const scores=s.scores[si]||[],days=(s.days&&s.days[si])||[];
    const sorted=scores.map((v,i)=>({v,d:days[i]||"",i})).sort((a,b)=>a.d.localeCompare(b.d));
    const ei=S.editIdx;
    const rows=sorted.map(({v,d,i})=>{
      if(ei&&ei.si===si&&ei.idx===i)return`<div style="background:${SCOL[si]}0e;border:1px solid ${SCOL[si]}44;border-radius:9px;padding:9px;margin-bottom:5px">
        <div style="display:flex;gap:7px;margin-bottom:5px">
          <input id="eSI" value="${esc(BUF.editScore)}" placeholder="${t("scorePh")}" oninput="liveES(this.value)" style="flex:1;background:#07070f;border:1.5px solid ${SCOL[si]};color:#e2e8f0;border-radius:7px;padding:7px 9px;font-size:13px;outline:none;font-family:monospace"/>
          <input type="date" id="eDI" value="${BUF.editDate}" onchange="BUF.editDate=this.value" style="flex:1;background:#07070f;border:1.5px solid #2a2a45;color:#888;border-radius:7px;padding:7px 9px;font-size:11px;outline:none"/>
        </div>
        <div id="ePrev" style="font-size:10px;color:${SCOL[si]};margin-bottom:5px">${BUF.editScore&&parseF(BUF.editScore)!==null?`→ ${parseF(BUF.editScore)}% (${grade(parseF(BUF.editScore)).l})`:""}</div>
        <div id="eErr" style="color:#f87171;font-size:10px;margin-bottom:4px;display:none"></div>
        <div style="display:flex;gap:7px">
          <button onclick="saveEE(${si},${i})" style="flex:1;background:${SCOL[si]};color:#000;border:none;border-radius:7px;padding:6px;font-weight:700;font-size:12px">✓ ${t("save")}</button>
          <button onclick="cancelE()" style="flex:1;background:#1a1a2e;border:1px solid #2a2a45;color:#666;border-radius:7px;padding:6px;font-size:12px">${t("cancel")}</button>
        </div>
      </div>`;
      return`<div style="display:flex;align-items:center;gap:7px;background:#0f0f1a;border-radius:9px;padding:6px 9px;margin-bottom:4px">
        <div style="flex:1"><span style="font-family:monospace;font-weight:700;color:${SCOL[si]};font-size:13px">${v}%</span>${d?`<span style="font-size:9px;color:#444;margin-left:7px">${fmt(d)}</span>`:""}</div>
        ${canEdit()?`<div class="iBtn" onclick="startE(${si},${i},${v},'${d}')" style="background:#4f46e522;border-color:#4f46e544">✏️</div><div class="iBtn" onclick="delE(${si},${i})" style="background:#dc262622;border-color:#dc262644">🗑️</div>`:""}
      </div>`;
    }).join("");
    return`<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:11px;font-weight:700;color:${SCOL[si]}">${subj}</span>
        <span style="font-size:10px;color:#555;font-family:monospace">o'rta: ${avg(scores)}%</span>
      </div>
      <div style="background:#07070f;border-radius:11px;padding:7px;margin-bottom:5px;overflow-x:auto">${mkSVG(sorted.map(x=>x.v),sorted.map(x=>fmt(x.d)))}</div>
      ${rows}
    </div>`;
  }).join("");
  return`<div class="overlay" onclick="back()"><div class="modal az" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
      <div><div style="font-size:17px;font-weight:900;color:#e2e8f0">${esc(s.name)}</div>
      ${s.filial?`<div style="font-size:9px;color:#555;margin-top:1px">${esc(s.filial)}${s.guruh?" • "+esc(s.guruh):""}</div>`:""}
      <div style="font-size:9px;color:#3a3a5a;margin-top:1px">${t("wholePeriod")}</div></div>
      <div style="text-align:right"><div style="font-size:26px;font-weight:900;color:${g.c};font-family:monospace">${ov}%</div><div style="font-size:9px;color:${g.c};background:${g.c}22;border-radius:5px;padding:1px 7px">${g.l}</div></div>
    </div>
    ${blocks}
    <button onclick="back()" style="width:100%;background:#1a1a2e;border:1px solid #2a2a45;color:#666;border-radius:9px;padding:9px;font-size:12px;margin-top:3px">${t("close")}</button>
  </div></div>`;
}

function processRows(rows,sessionDate){
  if(!rows.length){set({csvErr:"Ma'lumot topilmadi",csvLoading:false});return;}
  const{students,added,updated,skipped,merged_dupes,suspicious}=merge(rows,S.students,sessionDate);
  sv("st_students",students);
  logActivity(t("csvLoaded"),`${added} yangi, ${updated} yangilandi`);
  const confirmQueue=suspicious.filter(c=>!c.merged).map(c=>{
    const exist=students.find(s=>samePerson({name:s.name,filial:s.filial||"",guruh:s.guruh||""},{name:c.existingName,filial:c.row.filial,guruh:""})&&!s._pending);
    return{...c,existingId:exist?exist.id:null,existingGuruh:exist?exist.guruh:""};
  }).filter(c=>c.existingId);
  if(confirmQueue.length>0){
    set({students,confirmQueue,confirmIdx:0,csvLoading:false,csvErr:"",importReport:{added,updated,skipped,merged_dupes},page:"confirm"});
  } else {
    set({students,page:"importReport",csvLoading:false,csvErr:"",importReport:{added,updated,skipped,merged_dupes},confirmQueue:[],confirmIdx:0});
  }
}

document.getElementById("fileInp").addEventListener("change",async function(e){
  const file=e.target.files[0];if(!file)return;
  const nm=file.name.toLowerCase();
  if(nm.endsWith('.pdf')){
    set({csvLoading:true,csvErr:""});
    try{const buf=await file.arrayBuffer();processRows(await parsePDF(buf),"");}
    catch(err){set({csvErr:"PDF o'qib bo'lmadi: "+err.message,csvLoading:false});}
  } else {
    const reader=new FileReader();
    reader.onload=ev=>{const rows=nm.endsWith('.html')||nm.endsWith('.htm')?parseHTML(ev.target.result):parseCSV(ev.target.result);processRows(rows,"");};
    reader.readAsText(file,"UTF-8");
  }
  e.target.value="";
});

async function loadLink(){
  const url=(BUF.importUrl||document.getElementById("urlInp")?.value||"").trim();
  if(!url){set({csvErr:"Link kiriting"});return;}
  sv("st_importUrl",url);set({csvLoading:true,csvErr:"",importUrl:url});
  try{
    const idM=url.match(/\/d\/([a-zA-Z0-9_-]+)/),gidM=url.match(/[?&]gid=(\d+)/);
    let csvUrl=url;
    if(idM){const gid=gidM?gidM[1]:"0";csvUrl=`https://docs.google.com/spreadsheets/d/${idM[1]}/export?format=csv&gid=${gid}`;}
    const res=await fetch(csvUrl);if(!res.ok)throw new Error("Server: "+res.status);
    processRows(parseCSV(await res.text()),document.getElementById("dateInp")?.value||"");
  }catch(e){set({csvErr:"Xatolik: "+e.message,csvLoading:false});}
}

function saveStudent(){
  const name=(BUF.name||document.getElementById("nameInp")?.value||"").trim();
  if(!name){showErr("addErr",t("nameReq"));return;}
  const filial=(BUF.filial||document.getElementById("filialInp")?.value||"").trim();
  if(!filial){showErr("addErr",t("filialReq"));return;}
  const guruh=(BUF.guruh||document.getElementById("guruhInp")?.value||"").trim();
  const sc=[[],[],[]],dy=[[],[],[]];
  for(const en of BUF.entries){if(!en.score.trim())continue;const p=parseF(en.score);if(p===null){showErr("addErr",`"${en.score}" noto'g'ri`);return;}sc[en.si].push(p);dy[en.si].push(en.date||"");}
  const ns=[...S.students,{id:uid(),name,filial,guruh,scores:sc,days:dy}];
  sv("st_students",ns);logActivity(t("studentAdded"),`${name} (${filial})`);
  resetBuf();set({students:ns,page:"list"});
}
function saveScore(){
  const s=S.active;if(!s)return;
  const ns=[[],[],[]],nd=[[],[],[]];
  for(const en of BUF.entries){if(!en.score.trim())continue;const p=parseF(en.score);if(p===null){showErr("addErr",`"${en.score}" noto'g'ri`);return;}ns[en.si].push(p);nd[en.si].push(en.date||"");}
  const dy=s.days||[[],[],[]];
  const upd={...s,scores:s.scores.map((a,i)=>[...a,...ns[i]]),days:dy.map((a,i)=>[...a,...nd[i]])};
  const all=S.students.map(x=>x.id===upd.id?upd:x);
  sv("st_students",all);logActivity(t("scoreAdded"),s.name);
  resetBuf();set({students:all,page:"list",active:null});

async function loadActivityLog(){
  const el=document.getElementById("logList");if(!el)return;
  try{
    const entries=[];
    for(let i=0;i<3;i++){
      const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);
      try{
        const snap=await _db.collection("logs").doc(d).collection("entries").orderBy("ts","desc").limit(50).get();
        snap.docs.forEach(doc=>entries.push({...doc.data(),dateKey:d}));
      }catch{}
    }
    if(!entries.length){el.innerHTML=`<div style="color:#555;text-align:center;padding:18px;font-size:12px">${t("noChanges")}</div>`;return;}
    entries.sort((a,b)=>b.ts-a.ts);
    el.innerHTML=entries.map(e=>{
      const rc=e.role==="admin"?"#f59e0b":e.role==="yadmin"?"#a78bfa":"#34d399";
      const ago=Math.round((Date.now()-e.ts)/60000);
      const as=ago<1?"Hozir":ago<60?`${ago} daq`:ago<1440?`${Math.round(ago/60)} soat`:`${Math.round(ago/1440)} kun`;
      return`<div style="background:#0f0f1a;border:1.5px solid #1a1a2e;border-radius:9px;padding:9px 11px;margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px">
          <span style="font-size:10px;font-weight:700;color:${rc}">${esc(e.who)}</span>
          <span style="font-size:9px;color:#3a3a5a">${as} oldin</span>
        </div>
        <div style="font-size:12px;color:#e2e8f0">${esc(e.action)}</div>
        ${e.details?`<div style="font-size:10px;color:#555;margin-top:1px">${esc(e.details)}</div>`:""}
      </div>`;
    }).join("");
  }catch(e){el.innerHTML=`<div style="color:#f87171;font-size:11px;padding:9px">Xato: ${e.message}</div>`;}
}

// Confirm queue
function confirmYes(){
  const q=S.confirmQueue,c=q[S.confirmIdx];if(!c)return;
  const st=[...S.students];
  const existIdx=st.findIndex(s=>s.id===c.existingId);
  const pendIdx=st.findIndex(s=>s.name===c.row.name&&s.filial===c.row.filial&&s._pending);
  if(existIdx>=0&&pendIdx>=0){
    const exist=st[existIdx],pend=st[pendIdx];const dy=exist.days||[[],[],[]];
    pend.scores[0].forEach((v,i)=>{exist.scores[0].push(v);dy[0].push((pend.days||[[],[],[]])[0][i]||"");});
    pend.scores[1].forEach((v,i)=>{exist.scores[1].push(v);dy[1].push((pend.days||[[],[],[]])[1][i]||"");});
    pend.scores[2].forEach((v,i)=>{exist.scores[2].push(v);dy[2].push((pend.days||[[],[],[]])[2][i]||"");});
    exist.days=dy;st.splice(pendIdx,1);sv("st_students",st);
  }
  nextConfirm(st);
}
function confirmNo(){const st=S.students.map(s=>s._pending?{...s,_pending:undefined}:s);sv("st_students",st);nextConfirm(st);}
function confirmSkipAll(){const st=S.students.map(s=>s._pending?{...s,_pending:undefined}:s);sv("st_students",st);set({students:st,page:"importReport",confirmQueue:[],confirmIdx:0});}
function nextConfirm(st){
  const next=S.confirmIdx+1,students=st||S.students;
  if(next>=S.confirmQueue.length){const c=students.map(s=>({...s,_pending:undefined}));sv("st_students",c);set({students:c,page:"importReport",confirmIdx:0});}
  else set({students:students||S.students,confirmIdx:next});
}
function finishConfirm(){const st=S.students.map(s=>({...s,_pending:undefined}));sv("st_students",st);set({students:st,page:"importReport",confirmQueue:[],confirmIdx:0});}

  if(!snap.exists)return;

  const lsTime=parseInt(localStorage.getItem("st_students_time")||"0");

    S.students=data.students;
    try{localStorage.setItem("st_students",JSON.stringify(data.students));localStorage.setItem("st_students_time",String(fbTime));}catch{}
    render();
  }
},(err)=>console.warn("Listener:",err));
