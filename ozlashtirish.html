// ══════════════════════════════════════════════════════
// SMART NAME MATCHING
// ══════════════════════════════════════════════════════
const CYR={'А':'A','а':'a','Б':'B','б':'b','В':'V','в':'v','Г':'G','г':'g','Д':'D','д':'d',
'Е':'E','е':'e','Ё':'YO','ё':'yo','Ж':'J','ж':'j','З':'Z','з':'z','И':'I','и':'i',
'Й':'Y','й':'y','К':'K','к':'k','Л':'L','л':'l','М':'M','м':'m','Н':'N','н':'n',
'О':'O','о':'o','П':'P','п':'p','Р':'R','р':'r','С':'S','с':'s','Т':'T','т':'t',
'У':'U','у':'u','Ф':'F','ф':'f','Х':'H','х':'h','Ч':'Ch','ч':'ch','Ш':'Sh','ш':'sh',
'Щ':'Sh','Ъ':'','ъ':'','Ы':'I','ы':'i','Ь':'','ь':'','Э':'E','э':'e',
'Ю':'YU','ю':'yu','Я':'YA','я':'ya','Ў':'O','ў':'o','Қ':'K','қ':'k','Ғ':'G','ғ':'g','Ҳ':'H','ҳ':'h'};
const DIG={'0':'o','1':'i','2':'z','3':'e','4':'a','5':'s','6':'b','7':'t','8':'b','9':'g'};

function nw(w){
  // Step 1: Cyrillic→Latin (multi-char: Ё→YO, Ю→YU, Я→YA, Ч→CH, Ш→SH first)
  let r='';
  const up=w.trim().toUpperCase();
  for(let i=0;i<up.length;i++){
    const c=up[i];
    if(CYR[up[i]]!==undefined){r+=CYR[up[i]];}
    else{r+=c;}
  }
  r=r.toLowerCase();
  // Step 2: digit→letter
  r=[...r].map(c=>DIG[c]||c).join('');
  // Step 3: remove all apostrophe variants and special chars
  r=r.replace(/['\u2018\u2019\u02bc\u02bb\uff07`ʼʻʽ"$@#!]/g,'');
  // Step 4: normalize x→h only (q→k removed: too aggressive)
  r=r.replace(/x/g,'h');
  // Step 5: collapse duplicate consecutive chars
  r=r.replace(/(.)\1+/g,'$1');
  return r;
}
const nn=name=>nw((name||'').replace(/\s+/g,''));

function lev(a,b){
  if(a===b)return 0;if(a.length<b.length)[a,b]=[b,a];
  let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=0;i<a.length;i++){const c=[i+1];for(let j=0;j<b.length;j++)c.push(Math.min(p[j]+(a[i]!==b[j]?1:0),c[j]+1,p[j+1]+1));p=c;}
  return p[b.length];
}

// Word similarity — length-based strict threshold
// Short words (≤5): must be exact. Medium (6-8): max 1 edit. Long (9+): max 2 edits.
function wSim(a,b){
  if(a===b)return 1;
  const d=lev(a,b),m=Math.max(a.length,b.length,1);
  const maxEdit=m<=5?0:m<=8?1:2;
  if(d>maxEdit)return 0;
  return 1-d/m;
}

// Split full name into [surname, firstname] parts
function splitName(name){
  const parts=(name||'').trim().split(/\s+/).map(nw).filter(Boolean);
  return parts;
}

// Qoida: Familiya + Filial mos kelsa → bir xil odam
// Ism: prefix bo'lsa ham (Doniyor ⊂ Doniyorbek) yoki o'xshash bo'lsa — bir xil
function samePerson(s1,s2){
  // ── 1. FILIAL ──────────────────────────────────────
  const fn1=nn(s1.filial||''),fn2=nn(s2.filial||'');
  if(fn1&&fn2&&fn1!==fn2) return false; // filial farq → boshqa odam

  // ── 2. ISM TO'LIQ EXACT ────────────────────────────
  if(nn(s1.name)===nn(s2.name)) return true;

  const w1=splitName(s1.name||''),w2=splitName(s2.name||'');
  if(!w1.length||!w2.length) return false;

  // Prefix har doim ruxsat (sinf/ism farqidan qat'i nazar)
  const pfx=(a,b)=>a&&b&&(b.startsWith(a)||a.startsWith(b));

  const match=(sA,fA,sB,fB)=>{
    if(wSim(sA,sB)<0.80) return false; // familiya mos emas
    if(!fA||!fB) return true; // ism yo'q — familiya yetarli
    return pfx(fA,fB)||wSim(fA,fB)>=0.80;
  };

  const s1n=w1[0],f1n=w1.slice(1).join('');
  const s2n=w2[0],f2n=w2.slice(1).join('');
  if(match(s1n,f1n,s2n,f2n)) return true;

  // Tartib almashgan: "Doniyor Akramjonov" == "Akramjonov Doniyor"
  if(w1.length>=2&&w2.length>=2){
    const s1r=w1[w1.length-1],f1r=w1.slice(0,-1).join('');
    const s2r=w2[w2.length-1],f2r=w2.slice(0,-1).join('');
    if(match(s1r,f1r,s2n,f2n)) return true;
    if(match(s1n,f1n,s2r,f2r)) return true;
    if(match(s1r,f1r,s2r,f2r)) return true;
  }
  return false;
}

// ══════════════════════════════════════════════════════
// CSV / HTML PARSERS
// ══════════════════════════════════════════════════════
function splitCSV(line){
  const r=[];let cur="",inQ=false;
  for(const c of line){if(c==='"'){inQ=!inQ;continue;}if(c===','&&!inQ){r.push(cur);cur="";continue;}cur+=c;}
  r.push(cur);return r;
}

function detectCols(lines){
  const cols={nameCol:1,filialCol:2,guruhCol:3,sub1F:5,sub2F:7,jamiF:8,sub2:"muammo",date:"",merged:false};
  if(!lines.length)return cols;
  const r0=splitCSV(lines[0]).map(c=>c.toLowerCase().trim());
  if(r0[0]==="ism"||r0[0]==="name"){
    cols.merged=true;
    cols.nameCol  =r0.findIndex(c=>c==="ism"||c==="name");
    cols.filialCol=r0.findIndex(c=>c.includes("filial"));
    cols.guruhCol =r0.findIndex(c=>c.includes("guruh")||c.includes("sinf"));
    cols.dateCol  =r0.findIndex(c=>c.includes("sana")||c.includes("date"));
    cols.sub1F    =r0.findIndex(c=>c.includes("matematik"));
    cols.inglizC  =r0.findIndex(c=>c.includes("ingliz"));
    cols.muammoC  =r0.findIndex(c=>c.includes("muam"));
    cols.jamiF    =r0.findIndex(c=>c.includes("jami"));
    return cols;
  }
  const dm=lines[0].match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(dm)cols.date=`${dm[3]}-${dm[2]}-${dm[1]}`;
  if(lines.length>1){const r1=lines[1].toLowerCase();cols.sub2=(r1.includes("ingliz")||r1.includes("англий"))?"ingliz":"muammo";}
  return cols;
}

function parseCSV(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const res=[];if(lines.length<2)return res;
  const C=detectCols(lines);
  const gf=(c,idx)=>{if(idx<0||idx>=c.length)return 0;return Math.min(100,Math.max(0,parseFloat((c[idx]||"0").replace(",","."))||0));};
  if(C.merged){
    for(let i=1;i<lines.length;i++){
      const c=splitCSV(lines[i]);const name=(c[C.nameCol]||"").trim();if(!name)continue;
      const filial=(c[C.filialCol]||"").trim();
      if(!filial)continue; // skip if no filial
      res.push({name,filial,guruh:(c[C.guruhCol]||"").trim(),
        mathF:gf(c,C.sub1F),inglizF:gf(c,C.inglizC),muammoF:gf(c,C.muammoC),jamiF:gf(c,C.jamiF),
        date:C.dateCol>=0?(c[C.dateCol]||"").trim():C.date});
    }
    return res;
  }
  for(let i=3;i<lines.length;i++){
    const c=splitCSV(lines[i]);const name=(c[C.nameCol]||"").trim();if(!name)continue;
    const filial=(c[C.filialCol]||"").trim();
    if(!filial)continue; // skip if no filial
    const mF=gf(c,C.sub1F),s2F=gf(c,C.sub2F),jF=gf(c,C.jamiF);
    if(mF===0&&s2F===0&&jF===0)continue;
    res.push({name,filial,guruh:(c[C.guruhCol]||"").trim(),
      mathF:mF,inglizF:C.sub2==="ingliz"?s2F:0,muammoF:C.sub2==="muammo"?s2F:0,jamiF:jF,date:C.date});
  }
  return res;
}

function parseHTML(html){
  const rows=[];
  const trRe=/<tr[^>]*>([\s\S]*?)<\/tr>/gi;const tagRe=/<[^>]+>/g;
  let tm;
  while((tm=trRe.exec(html))!==null){
    const cells=[];let td;const r2=/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi;
    while((td=r2.exec(tm[1]))!==null){
      cells.push(td[1].replace(tagRe,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&')
        .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;/g,"'").trim());
    }
    if(cells.length)rows.push(cells);
  }
  if(rows.length<4)return[];
  let date="";const dm=[...rows.slice(0,3)].join(" ").match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(dm)date=`${dm[3]}-${dm[2]}-${dm[1]}`;
  const sub2=[...rows.slice(0,4)].join(" ").toLowerCase().includes("ingliz")?"ingliz":"muammo";
  const res=[];
  for(let i=4;i<rows.length;i++){
    const r=rows[i];const name=(r[2]||"").trim();
    if(!name||/^\d+$/.test(name)||name.toLowerCase().includes("smena")||name.length<3)continue;
    const filial=(r[3]||"").trim();
    if(!filial)continue; // skip no filial
    const gf=idx=>idx<r.length?Math.min(100,Math.max(0,parseFloat((r[idx]||"0").replace(",","."))||0)):0;
    const mF=gf(6),s2F=gf(8),jF=gf(9);
    if(mF===0&&s2F===0)continue;
    res.push({name,filial,guruh:(r[4]||"").trim(),
      mathF:mF,inglizF:sub2==="ingliz"?s2F:0,muammoF:sub2==="muammo"?s2F:0,jamiF:jF,date});
  }
  return res;
}

// ══════════════════════════════════════════════════════
// PDF PARSER (text-based, from PDF.js extracted text)
// ══════════════════════════════════════════════════════
// PDF text comes as plain text lines — parse like CSV but space-separated
function parsePDFText(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const res=[];

  // Detect date
  let date="";
  const dm=text.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if(dm)date=`${dm[3]}-${dm[2]}-${dm[1]}`;

  // Detect sub2
  let sub2="muammo";
  for(const l of lines.slice(0,5)){
    if(/ingliz|англий/i.test(l)){sub2="ingliz";break;}
    if(/muammo|tanqid/i.test(l)){sub2="muammo";break;}
  }

  // Known filials for detection
  const FILIALS=["Parkent","Rakat","Sergeli","Ganga","Chilonzor"];

  // Parse data lines
  // Format: [idx] [name...] [filial] [guruh] [ball] [foiz] [ball] [foiz] [jami]
  for(const line of lines){
    // Skip header-like lines
    if(/f\.i\.o|filial|sinf|matematika|ingliz|muammo|natija|foiz|ball/i.test(line)&&line.length<60)continue;
    if(/^\d{2}\.\d{2}\.\d{4}/.test(line))continue;

    // Must start with a number (row index)
    const parts=line.split(/\s+/);
    if(!parts.length||!/^\d+$/.test(parts[0]))continue;

    // Find filial in parts
    const filialIdx=parts.findIndex(p=>FILIALS.some(f=>f.toLowerCase()===p.toLowerCase()));
    if(filialIdx<0)continue;
    const filial=parts[filialIdx];

    // Name = parts between index and filial
    const nameParts=parts.slice(1,filialIdx);
    if(!nameParts.length)continue;
    const name=nameParts.join(' ').trim();
    if(name.length<3)continue;

    // Guruh = parts after filial that look like class
    let guruh="";
    const afterFilial=parts.slice(filialIdx+1);
    const gIdx=afterFilial.findIndex(p=>/\d/.test(p)&&(p.toLowerCase().includes('класс')||p.toLowerCase().includes('klass')||p.toLowerCase().includes('class')));

    // Try to find t("sinfPh") pattern
    const lineAfter=afterFilial.join(' ');
    const gm=lineAfter.match(/(\d+)\s*(класс|klass|class)/i);
    if(gm)guruh=`${gm[1]} класс`;

    // Numbers at end: ball foiz ball foiz jami
    const nums=parts.filter(p=>/^[\d,\.]+$/.test(p)).map(p=>parseFloat(p.replace(',','.'))||0);
    if(!nums.length)continue;

    // Last number = jami foiz
    const jamiF=Math.min(100,Math.max(0,Math.round(nums[nums.length-1])));

    // Find foiz values (decimal with ,0): look for x,0 pattern
    const foizParts=parts.filter(p=>/^\d+[,\.]\d+$/.test(p)).map(p=>parseFloat(p.replace(',','.'))||0);
    const mathF=foizParts.length>=1?Math.min(100,Math.round(foizParts[0])):0;
    const sub2F=foizParts.length>=2?Math.min(100,Math.round(foizParts[1])):0;

    if(mathF===0&&sub2F===0&&jamiF===0)continue;

    res.push({
      name,filial,guruh,date,
      mathF,
      inglizF:sub2==="ingliz"?sub2F:0,
      muammoF:sub2==="muammo"?sub2F:0,
      jamiF
    });
  }
  return res;
}

// MERGE (smart matching with filial+guruh rules)
// ══════════════════════════════════════════════════════
function merge(rows,students,sessionDate){
  const res=students.map(s=>({...s,scores:s.scores.map(a=>[...a]),days:(s.days||[[],[],[]]).map(a=>[...a])}));
  let added=0,updated=0;
  const skipped=[];  // {name, filial, reason}
  const merged_dupes=[];

  for(const row of rows){
    const d=sessionDate||row.date||"";

    // Find matching existing student
    const idx=res.findIndex(s=>samePerson(
      {name:s.name,filial:s.filial||"",guruh:s.guruh||""},
      {name:row.name,filial:row.filial,guruh:row.guruh}
    ));

    if(idx>=0){
      const s=res[idx];const dy=s.days||[[],[],[]];
      if(row.mathF>0){s.scores[0].push(row.mathF);dy[0].push(d);}
      if(row.inglizF>0){s.scores[1].push(row.inglizF);dy[1].push(d);}
      if(row.muammoF>0){s.scores[2].push(row.muammoF);dy[2].push(d);}
      s.days=dy;res[idx]=s;updated++;
      // Track if name was different (merged)
      if(nn(s.name)!==nn(row.name))merged_dupes.push([row.name,s.name]);
    } else {
      // New student — guruh required
      if(!row.guruh){
        skipped.push({name:row.name,filial:row.filial,reason:"sinf yo'q"});
        continue;
      }
      const sc=[[],[],[]],dy=[[],[],[]];
      if(row.mathF>0){sc[0].push(row.mathF);dy[0].push(d);}
      if(row.inglizF>0){sc[1].push(row.inglizF);dy[1].push(d);}
      if(row.muammoF>0){sc[2].push(row.muammoF);dy[2].push(d);}
      res.push({id:uid(),name:row.name,filial:row.filial,guruh:row.guruh,scores:sc,days:dy});
      added++;
    }
  }
  return{students:res,added,updated,skipped,merged_dupes};
}

// Shubhali juft: familiya o'xshash lekin ism qisqa/yo'q
function isSuspicious(name1, name2){
  const w1=splitName(name1), w2=splitName(name2);
  if(!w1.length||!w2.length) return false;
  // Bir so'zli ism (faqat familiya yoki faqat ism)
  if(w1.length===1||w2.length===1) return true;
  // Ism prefix: Doniyor ⊂ Doniyorbek
  const f1=w1.slice(1).join(''), f2=w2.slice(1).join('');
  if(f1&&f2&&(f2.startsWith(f1)||f1.startsWith(f2))&&f1!==f2) return true;
  return false;
}

function merge(rows,students,sessionDate){
  const res=students.map(s=>({...s,scores:s.scores.map(a=>[...a]),days:(s.days||[[],[],[]]).map(a=>[...a])}));
  let added=0,updated=0;
  const skipped=[];
  const merged_dupes=[];
  const suspicious=[];   // [{row, existingIdx, existingName}] — needs confirmation
  const pendingRows=[];  // rows that need to be added as new after confirmation

  for(const row of rows){
    const d=sessionDate||row.date||"";
    const idx=res.findIndex(s=>samePerson(
      {name:s.name,filial:s.filial||"",guruh:s.guruh||""},
      {name:row.name,filial:row.filial,guruh:row.guruh}
    ));

    if(idx>=0){
      const s=res[idx];const dy=s.days||[[],[],[]];
      if(row.mathF>0){s.scores[0].push(row.mathF);dy[0].push(d);}
      if(row.inglizF>0){s.scores[1].push(row.inglizF);dy[1].push(d);}
      if(row.muammoF>0){s.scores[2].push(row.muammoF);dy[2].push(d);}
      s.days=dy;res[idx]=s;updated++;
      if(nn(s.name)!==nn(row.name)){
        merged_dupes.push([row.name,s.name]);
        // Shubhali birlashtirishni belgilash
        if(isSuspicious(s.name,row.name)){
          suspicious.push({row,existingIdx:idx,existingName:s.name,date:d,merged:true});
        }
      }
    } else {
      // Yangi o'quvchi — avval shubhali juftni tekshir
      const suspIdx=res.findIndex(s=>{
        const fn1=nn(s.filial||''),fn2=nn(row.filial||'');
        if(fn1&&fn2&&fn1!==fn2) return false;
        const w1=splitName(s.name),w2=splitName(row.name);
        if(!w1.length||!w2.length) return false;
        // Familiya o'xshash?
        return wSim(w1[0],w2[0])>=0.80;
      });
      if(suspIdx>=0 && isSuspicious(res[suspIdx].name,row.name)){
        suspicious.push({row,existingIdx:suspIdx,existingName:res[suspIdx].name,date:d,merged:false});
        pendingRows.push({row,d});
        continue;
      }
      const sc=[[],[],[]],dy=[[],[],[]];
      if(row.mathF>0){sc[0].push(row.mathF);dy[0].push(d);}
      if(row.inglizF>0){sc[1].push(row.inglizF);dy[1].push(d);}
      if(row.muammoF>0){sc[2].push(row.muammoF);dy[2].push(d);}
      res.push({id:uid(),name:row.name,filial:row.filial,guruh:row.guruh,scores:sc,days:dy});
      added++;
    }
  }
  // Add pending as new (will be confirmed later)
  for(const {row,d} of pendingRows){
    const sc=[[],[],[]],dy=[[],[],[]];
    if(row.mathF>0){sc[0].push(row.mathF);dy[0].push(d);}
    if(row.inglizF>0){sc[1].push(row.inglizF);dy[1].push(d);}
    if(row.muammoF>0){sc[2].push(row.muammoF);dy[2].push(d);}
    res.push({id:uid(),name:row.name,filial:row.filial,guruh:row.guruh,scores:sc,days:dy,_pending:true});
    added++;
  }
  return{students:res,added,updated,skipped,merged_dupes,suspicious};
}

function mkSVG(scores,days){
  if(!scores||!scores.length)return`<div style="color:#2a2a45;text-align:center;padding:18px 0;font-size:11px">${t("noData")}</div>`;
  const W=300,H=110,PL=34,PB=22,PT=16,PR=8,cW=W-PL-PR,cH=H-PB-PT;
  const pts=scores.map((v,i)=>({x:PL+(i/Math.max(scores.length-1,1))*cW,y:PT+cH-(v/100)*cH,v}));
  const poly=pts.map(p=>`${p.x},${p.y}`).join(" ");
  const area=`${pts[0].x},${PT+cH} ${poly} ${pts[pts.length-1].x},${PT+cH}`;
  const grow=scores.length>1&&scores[scores.length-1]>=scores[0];
  const diff=scores.length>1?Math.round((scores[scores.length-1]-scores[0])/Math.max(scores[0],1)*100):0;
  const lc=grow?"#34d399":"#f87171",fc=grow?"#34d39918":"#f8717118";
  const grids=[0,25,50,75,100].map(s=>{const y=PT+cH-(s/100)*cH;return`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#1e1e33" stroke-width="1"/><text x="${PL-4}" y="${y+4}" fill="#3a3a5a" font-size="8" text-anchor="end">${s}</text>`;}).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${lc}"/><text x="${p.x}" y="${p.y-6}" fill="${lc}" font-size="7" text-anchor="middle">${p.v}%</text><text x="${p.x}" y="${H-3}" fill="#3a3a5a" font-size="7" text-anchor="middle">${days&&days[i]?days[i]:i+1}</text>`).join("");
  return`<div style="display:flex;justify-content:flex-end;margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${lc};background:${lc}22;padding:2px 8px;border-radius:20px">${diff>0?"▲":diff<0?"▼":"—"} ${Math.abs(diff)}%</span></div><svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">${grids}<polygon points="${area}" fill="${fc}"/><polyline points="${poly}" fill="none" stroke="${lc}" stroke-width="2" stroke-linejoin="round"/>${dots}<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+cH}" stroke="#2a2a45" stroke-width="1"/></svg>`;
}

// AUTH TIZIMI
// ══════════════════════════════════════════════════════
async function hashPass(pass){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pass));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Admin paroli hash (Rfvedc343434$$)
const ADMIN_HASH="696371582f22f2890455ab537d0463757c82862c986adc09c8cd303bcc7362d7";

const AUTH={
  role:ld("auth_role")||"guest",   // guest | ustoz | yadmin | admin
  name:ld("auth_name")||"",
  staffId:ld("auth_staffid")||"",
};

async function checkKey(key){
  const h=await hashPass(key);
  if(h===ADMIN_HASH)return{role:"admin",name:"Admin"};
  try{
    const snap=await _db.collection("staff").get();
    for(const doc of snap.docs){
      const d=doc.data();
      if(d.keyHash===h&&d.active!==false){
        return{role:d.role||"ustoz",name:d.name||"Ustoz",staffId:doc.id};
      }
    }
  }catch(e){console.warn(e);}
  return null;
}

// Firestore logs/YYYY-MM-DD kollekciyasiga yozadi, 3 kundan keyin o'chadi
async function logActivity(action,details=""){
  if(!canEdit())return;
  try{
    const now=new Date();
    const dateKey=now.toISOString().slice(0,10);
    await _db.collection("logs").doc(dateKey).collection("entries").add({
      who:AUTH.name||AUTH.role,
      role:AUTH.role,
      action,details,
      ts:Date.now(),
      time:now.toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"})
    });
    // 3 kundan eski loglarni o'chir
    const old3=new Date(Date.now()-3*24*60*60*1000).toISOString().slice(0,10);
    const old2=new Date(Date.now()-4*24*60*60*1000).toISOString().slice(0,10);
    const old1=new Date(Date.now()-5*24*60*60*1000).toISOString().slice(0,10);
    [old1,old2,old3].forEach(async d=>{
      try{
        const s=await _db.collection("logs").doc(d).collection("entries").limit(1).get();
        if(!s.empty){
          const batch=_db.batch();
          const all=await _db.collection("logs").doc(d).collection("entries").get();
          all.docs.forEach(doc=>batch.delete(doc.ref));
          await batch.commit();
        }
      }catch{}
    });
  }catch(e){console.warn("Log xato:",e);}
}

  const oravg=n?Math.round(avgs.reduce((a,b)=>a+b,0)/n):0;

  const fanStats=SUBJ().map((subj,si)=>{

    const favg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;

  return`<div style="padding:10px 12px 0">

    <!-- Fanlar accordion -->
    <div style="margin-bottom:6px">
      <div onclick="togglePanel('fanlar')" style="display:flex;align-items:center;justify-content:space-between;background:#0f0f1a;border:1.5px solid ${S.openPanel==='fanlar'?'#34d399':'#1a1a2e'};border-radius:${S.openPanel==='fanlar'?'10px 10px 0 0':'10px'};padding:8px 14px;cursor:pointer">

        <span style="font-size:11px;color:${S.openPanel==='fanlar'?'#34d399':'#555'};display:inline-block;transform:${S.openPanel==='fanlar'?'rotate(180deg)':'rotate(0)'};transition:transform .25s">▼</span>
      </div>
      <div class="acc-content ${S.openPanel==='fanlar'?'open':''}" style="background:#0b0b18;border:${S.openPanel==='fanlar'?'1.5px':'0'} solid #34d39933;border-top:none;border-radius:0 0 10px 10px">
        <div style="padding:10px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
          ${fanStats.map(f=>`<div style="background:#0f0f1a;border:1px solid ${f.c}33;border-radius:10px;padding:8px 6px;text-align:center">
            <div style="font-size:16px;font-weight:900;color:${f.c};font-family:monospace">${f.favg}%</div>
            <div style="font-size:9px;color:#888;margin-top:2px">${f.subj.split(' ')[0]}</div>
            <div style="font-size:8px;color:#3a3a5a">${f.n} ta</div>
          </div>`).join("")}
        </div>
      </div>
    </div>

    <!-- Filiallar tugmasi — accordion pastda ochiladi -->
    <div style="margin-bottom:8px">
      <div onclick="togglePanel('filiallar')" style="display:flex;align-items:center;justify-content:space-between;background:#0f0f1a;border:1.5px solid ${S.openPanel==='filiallar'?'#60a5fa':'#1a1a2e'};border-radius:10px;padding:8px 14px;cursor:pointer">
        <span style="font-size:11px;font-weight:700;color:${S.openPanel==='filiallar'?'#60a5fa':'#888'}">🏫 Filiallar</span>
        <span style="font-size:11px;color:${S.openPanel==='filiallar'?'#60a5fa':'#555'};display:inline-block;transform:${S.openPanel==='filiallar'?'rotate(180deg)':'rotate(0)'};transition:transform .25s">▼</span>
      </div>
    </div>

    <!-- Ro'yxat / Statistika tabs -->
    <div style="display:flex;gap:6px">
      ${["list","stats"].map(t=>`<div onclick="set({tab:'${t}'})" style="padding:5px 14px;border-radius:20px;font-size:10px;font-weight:700;cursor:pointer;border:1.5px solid ${S.tab===t?"#a78bfa":"#2a2a45"};color:${S.tab===t?"#a78bfa":"#555"};background:${S.tab===t?"#a78bfa18":"transparent"}">${t_=="list"?t("list"):t("stats")}</div>`).join("")}
    </div>
  </div>`;
}

function renderSearchDropdown(q){
  if(!q)return"";
  const ql=q.toLowerCase();
  const matches=S.students.filter(s=>
    s.name.toLowerCase().includes(ql)||
    (s.filial||"").toLowerCase().includes(ql)||
    (s.guruh||"").toLowerCase().includes(ql)
  ).slice(0,8);
  if(!matches.length)return`<div style="background:#0b0b18;border:1.5px solid #a78bfa;border-top:none;border-radius:0 0 12px 12px;padding:12px 16px;font-size:12px;color:#3a3a5a">${t("noFound")}</div>`;
  return`<div style="background:#0b0b18;border:1.5px solid #a78bfa;border-top:none;border-radius:0 0 12px 12px;overflow:hidden;max-height:260px;overflow-y:auto">
    ${matches.map(s=>{
      const ov=ovAvg(s),g=grade(ov);
      const hi=s.name.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<b style="color:#a78bfa">$1</b>');
      return`<div onmousedown="event.preventDefault()" onclick="selectSearchResult('${s.id}')" style="padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid #1a1a2e;active:background:#1a1a2e">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;color:#e2e8f0">${hi}</div>
          <div style="font-size:10px;color:#555;margin-top:1px">${esc(s.filial||"")}${s.guruh?" • "+esc(s.guruh):""}</div>
        </div>
        <div style="font-size:15px;font-weight:900;color:${g.c};font-family:monospace;flex-shrink:0">${ov}%</div>
      </div>`;
    }).join("")}
  </div>`;
}

// ── Accordion filial list ─────────────────────────────
function getFiltered(filialFilter){
  let fl=S.students.filter(s=>
    s.name.toLowerCase().includes(S.search.toLowerCase())||
    (s.filial||"").toLowerCase().includes(S.search.toLowerCase())||
    (s.guruh||"").toLowerCase().includes(S.search.toLowerCase())
  );
  if(filialFilter&&filialFilter!=="Barchasi") fl=fl.filter(s=>s.filial===filialFilter);
  fl.sort((a,b)=>{
    if(S.sortBy==="ism")return S.sortAsc?a.name.localeCompare(b.name):b.name.localeCompare(a.name);
    const va=S.sortBy==="math"?avg(a.scores[0]):S.sortBy==="ingliz"?avg(a.scores[1]):S.sortBy==="muammo"?avg(a.scores[2]):ovAvg(a);
    const vb=S.sortBy==="math"?avg(b.scores[0]):S.sortBy==="ingliz"?avg(b.scores[1]):S.sortBy==="muammo"?avg(b.scores[2]):ovAvg(b);
    return S.sortAsc?va-vb:vb-va;
  });
  return fl;
}

function renderAccordion(){
  if(!S.students.length)return`<div style="text-align:center;color:#2a2a45;padding:50px 0;font-size:13px">${t("noStudents")}</div>`;

  // Filiallar tugmasi bosilmagan bo'lsa — accordion yashirin

  const filials=["Barchasi",...new Set(S.students.map(s=>s.filial).filter(Boolean))].sort((a,b)=>a==="Barchasi"?-1:a.localeCompare(b));

    const scores=s.scores[si]||[];const days=(s.days&&s.days[si])||[];

function confirmYes(){
  const q=S.confirmQueue,c=q[S.confirmIdx];
  if(!c)return;
  // Merge: mavjud o'quvchiga qo'sh, pending ni o'chir
  const st=[...S.students];
  const existIdx=st.findIndex(s=>s.id===c.existingId);
  const pendIdx=st.findIndex(s=>s.name===c.row.name&&s.filial===c.row.filial&&s._pending);
  if(existIdx>=0&&pendIdx>=0){
    const exist=st[existIdx];const pend=st[pendIdx];
    const dy=exist.days||[[],[],[]];
    pend.scores[0].forEach((v,i)=>{exist.scores[0].push(v);dy[0].push((pend.days||[[],[],[]])[0][i]||"");});
    pend.scores[1].forEach((v,i)=>{exist.scores[1].push(v);dy[1].push((pend.days||[[],[],[]])[1][i]||"");});
    pend.scores[2].forEach((v,i)=>{exist.scores[2].push(v);dy[2].push((pend.days||[[],[],[]])[2][i]||"");});
    exist.days=dy;
    st.splice(pendIdx,1);
    sv("st_students",st);
  }
  nextConfirm(st);
}

function confirmNo(){
  // Keep as separate — remove _pending flag
  const st=S.students.map(s=>s._pending?{...s,_pending:undefined}:s);
  sv("st_students",st);
  nextConfirm(st);
}

function confirmSkipAll(){
  const st=S.students.map(s=>s._pending?{...s,_pending:undefined}:s);
  sv("st_students",st);
  set({students:st,page:"importReport",confirmQueue:[],confirmIdx:0});
}

function nextConfirm(st){
  const next=S.confirmIdx+1;
  const students=st||S.students;
  if(next>=S.confirmQueue.length){
    // Clean all _pending flags
    const cleaned=students.map(s=>({...s,_pending:undefined}));
    sv("st_students",cleaned);
    set({students:cleaned,page:"importReport",confirmIdx:0});
  } else {
    set({students:students||S.students,confirmIdx:next});
  }
}

function finishConfirm(){
  const st=S.students.map(s=>({...s,_pending:undefined}));
  sv("st_students",st);
  set({students:st,page:"importReport",confirmQueue:[],confirmIdx:0});
}

function processRows(rows,sessionDate){
  if(!rows.length){set({csvErr:"Ma'lumot topilmadi",csvLoading:false});return;}
  const{students,added,updated,skipped,merged_dupes,suspicious}=merge(rows,S.students,sessionDate);
  sv("st_students",students);
  logActivity("CSV yuklandi",`${added} yangi, ${updated} yangilandi`);

  // Build confirm queue with existing student IDs
  const confirmQueue=suspicious.filter(c=>!c.merged).map(c=>{
    const exist=students.find(s=>samePerson(
      {name:s.name,filial:s.filial||"",guruh:s.guruh||""},
      {name:c.existingName,filial:c.row.filial,guruh:""}
    )&&!s._pending);
    return{...c,existingId:exist?exist.id:null,existingGuruh:exist?exist.guruh:""};
  }).filter(c=>c.existingId);

  if(confirmQueue.length>0){
    set({students,confirmQueue,confirmIdx:0,
      csvLoading:false,csvErr:"",
      importReport:{added,updated,skipped,merged_dupes},
      page:"confirm"});
  } else {
    set({students,page:"importReport",csvLoading:false,csvErr:"",
      importReport:{added,updated,skipped,merged_dupes},
      confirmQueue:[],confirmIdx:0});
  }
}

// ── PDF.js loader ─────────────────────────────────────
async function loadPDFjs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror=reject;
    document.head.appendChild(s);
  });
}

async function parsePDF(arrayBuffer){
  const pdfjsLib=await loadPDFjs();
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let fullText="";
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    // Group items by Y position (same line)
    const items=content.items.map(item=>({
      text:item.str,
      x:Math.round(item.transform[4]),
      y:Math.round(item.transform[5])
    }));
    // Sort by Y desc then X asc
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    // Group by Y (same line = within 3px)
    let lines=[],curY=null,curLine=[];
    for(const item of items){
      if(curY===null||Math.abs(item.y-curY)>4){
        if(curLine.length)lines.push(curLine.map(i=>i.text).join(' '));
        curLine=[item];curY=item.y;
      } else {
        curLine.push(item);
      }
    }
    if(curLine.length)lines.push(curLine.map(i=>i.text).join(' '));
    fullText+=lines.join('\n')+'\n';
  }
  return parsePDFText(fullText);
}

  const file=e.target.files[0];if(!file)return;
  const name=file.name.toLowerCase();
  const isPDF=name.endsWith('.pdf');
  const isHTML=name.endsWith('.html')||name.endsWith('.htm');

  if(isPDF){
    set({csvLoading:true,csvErr:""});
    try{
      const buf=await file.arrayBuffer();
      const rows=await parsePDF(buf);
      processRows(rows,"");
    }catch(err){
      set({csvErr:"PDF o'qib bo'lmadi: "+err.message,csvLoading:false});
    }
  } else {
    const reader=new FileReader();
    reader.onload=ev=>{
      const rows=isHTML?parseHTML(ev.target.result):parseCSV(ev.target.result);
      processRows(rows,"");
    };
    reader.readAsText(file,"UTF-8");
  }
  e.target.value="";
});

async function loadLink(){
  const url=(BUF.importUrl||document.getElementById("urlInp")?.value||"").trim();
  if(!url){set({csvErr:"Link kiriting"});return;}
  sv("st_importUrl",url);set({csvLoading:true,csvErr:"",importUrl:url});
  try{
    const idM=url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    const gidM=url.match(/[?&]gid=(\d+)/);
    let csvUrl=url;
    if(idM){const gid=gidM?gidM[1]:"0";csvUrl=`https://docs.google.com/spreadsheets/d/${idM[1]}/export?format=csv&gid=${gid}`;}
    const res=await fetch(csvUrl);
    if(!res.ok)throw new Error("Server: "+res.status);
    const rows=parseCSV(await res.text());
    processRows(rows,document.getElementById("dateInp")?.value||"");
  }catch(e){set({csvErr:"Xatolik: "+e.message,csvLoading:false});}
}

async function loadActivityLog(){
  const el=document.getElementById("logList");
  if(!el)return;
  try{
    const entries=[];
    for(let i=0;i<3;i++){
      const d=new Date(Date.now()-i*24*60*60*1000).toISOString().slice(0,10);
      const snap=await _db.collection("logs").doc(d).collection("entries")
        .orderBy("ts","desc").limit(50).get();
      snap.docs.forEach(doc=>entries.push({...doc.data(),dateKey:d}));
    }
    if(!entries.length){el.innerHTML=`<div style="color:#555;text-align:center;padding:20px;font-size:12px">Hozircha o'zgartirish yo'q</div>`;return;}
    entries.sort((a,b)=>b.ts-a.ts);

      const rc=e.role==="admin"?"#f59e0b":e.role==="yadmin"?"#a78bfa":"#34d399";
      const ago=Math.round((Date.now()-e.ts)/60000);
      const agoStr=ago<60?`${ago} daqiqa oldin`:ago<1440?`${Math.round(ago/60)} soat oldin`:`${Math.round(ago/1440)} kun oldin`;
      return`<div style="background:#0f0f1a;border:1.5px solid #1a1a2e;border-radius:10px;padding:10px 12px;margin-bottom:7px">

        <div style="font-size:12px;color:#e2e8f0">${esc(e.action)}</div>
        ${e.details?`<div style="font-size:10px;color:#555;margin-top:2px">${esc(e.details)}</div>`:""}
      </div>`;
    }).join("");
  }catch(e){el.innerHTML=`<div style="color:#f87171;font-size:11px;padding:10px">Xato: ${e.message}</div>`;}
}

      ⚠️ Kalitni xodimga Telegram yoki SMS orqali yuboring
    </div>

    <div id="addStaffErr" style="color:#f87171;font-size:11px;margin-bottom:10px;display:none"></div>

    <button onclick="saveStaff()" style="width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:13px;margin-bottom:8px">✓ Saqlash</button>
    <button onclick="go('staffMgmt')" style="width:100%;background:#1a1a2e;border:1px solid #2a2a45;color:#666;border-radius:10px;padding:9px;font-size:12px">Bekor</button>
  </div></div>`;
}

let _selectedRole="ustoz";
function selectRole(r){
  _selectedRole=r;
  const u=document.getElementById("roleUstoz");
  const a=document.getElementById("roleAdmin");
  if(u&&a){
    u.style.borderColor=r==="ustoz"?"#34d399":"#2a2a45";
    u.style.background=r==="ustoz"?"#34d39918":"transparent";
    u.style.color=r==="ustoz"?"#34d399":"#555";
    a.style.borderColor=r==="admin"?"#f59e0b":"#2a2a45";
    a.style.background=r==="admin"?"#f59e0b18":"transparent";
    a.style.color=r==="admin"?"#f59e0b":"#555";
  }
}

async function saveStaff(){
  const name=(document.getElementById("staffName")?.value||"").trim();
  const key=(document.getElementById("staffKey")?.value||"").trim();
  const err=document.getElementById("addStaffErr");
  if(!name){if(err){err.style.display="block";err.textContent="Ism kiriting!";}return;}
  if(!key||key.length<6){if(err){err.style.display="block";err.textContent="Kalit kamida 6 ta belgi!";}return;}
  try{
    const keyHash=await hashPass(key);
    await _db.collection("staff").add({
      name,role:_selectedRole,
      keyHash,keyPlain:key,  // keyPlain - admin ko'rishi uchun
      active:true,
      created:Date.now()
    });
    back();
    setTimeout(()=>go("staffMgmt"),100);
  }catch(e){if(err){err.style.display="block";err.textContent="Xato: "+e.message;}}
}

// Staff list va log yuklash (sahifa ochilganda)
const _origRender=render;
function render(){
  _origRender();
  if(S.page==="staffMgmt") setTimeout(loadStaffList,100);
  if(S.page==="activityLog") setTimeout(loadActivityLog,100);
}
// ══════════════════════════════════════════════════════
window._S=S;
window._render=render;

async function init(){
  resetBuf();
  render(); // Avval localStorage dan ko'rsat

  // Real-time listener — boshqa qurilmadan o'zgarsa darhol yangilanadi
  _db.collection("newton").doc("students").onSnapshot(snap=>{
    if(!snap.exists) return;
    const data=snap.data();
    if(!data||!data.students||data.students.length===0) return;

    const fbTime=data.updated||0;
    const lsTime=parseInt(localStorage.getItem("st_students_time")||"0");

    // Firestore yangroq bo'lsa yangilaydi
    if(fbTime>=lsTime){
      S.students=data.students;
      try{
        localStorage.setItem("st_students",JSON.stringify(data.students));
        localStorage.setItem("st_students_time",String(fbTime));
      }catch{}
      render();
      console.log(`🔥 Firestore: ${data.students.length} o'quvchi`);
    }
  },(err)=>{
    console.warn("Firestore listener xato:",err);
  });
}

init();
</script>
