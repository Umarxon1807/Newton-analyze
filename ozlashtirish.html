<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="O'zlashtirish"/>
<meta name="theme-color" content="#07070f"/>
<title>O'zlashtirish Tahlili</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{min-height:100%;background:#07070f;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden}
input,button{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:0;height:0}
.pill{width:44px;height:44px;border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.inp{width:100%;background:#07070f;border:1.5px solid #2a2a45;color:#e2e8f0;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;-webkit-appearance:none}
.inp:focus{border-color:#a78bfa}
.sheet-bg{position:fixed;inset:0;background:#07070fcc;backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#0b0b18;border:1.5px solid #2a2a45;border-radius:22px 22px 0 0;padding:22px 18px 48px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
.overlay{position:fixed;inset:0;background:#07070fdd;backdrop-filter:blur(10px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#0b0b18;border:1.5px solid #2a2a45;border-radius:22px;padding:20px 16px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;border:1px solid transparent}
.btn-grad{width:100%;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:14px}
@keyframes zoomIn{from{transform:scale(.75) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.anim-zoom{animation:zoomIn .25s cubic-bezier(.34,1.56,.64,1)}
.anim-up{animation:slideUp .28s ease}
</style>
</head>
<body>
<div id="root"></div>
<input type="file" id="csvFileInp" accept=".csv" style="display:none"/>
<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const SUBJECTS = ["Matematika","Ingliz tili","Muammoni hal qilish"];
const COLORS   = ["#34d399","#60a5fa","#f472b6"];
const SC       = ["Matematik","Ingliz","Tanqidiy"];

// ─── Utils ────────────────────────────────────────────────────────────────────
const uid   = ()=>Math.random().toString(36).slice(2,9);
const avg   = a=>a&&a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const ovAvg = s=>Math.min(100,Math.round(SUBJECTS.reduce((sum,_,i)=>sum+avg(s.scores[i]),0)/3));
const grade = v=>v>=85?{l:"A'lo",c:"#34d399"}:v>=70?{l:"Yaxshi",c:"#60a5fa"}:v>=55?{l:"Qoniqarli",c:"#fbbf24"}:{l:"Qoniqarsiz",c:"#f87171"};
const parseF= str=>{
  const s=str.trim();
  if(s.includes("/")){const[a,b]=s.split("/").map(Number);if(!isNaN(a)&&!isNaN(b)&&b>0)return Math.min(100,Math.round(a/b*100));}
  const n=Number(s);return(!isNaN(n)&&n>=0&&n<=100)?Math.round(n):null;
};
const esc = s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const ld  = k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const sv  = (k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
const fmt = d=>d?d.slice(5):"";

// ─── Name normalization (Cyrillic ↔ Latin ↔ mixed) ───────────────────────────
// Convert Cyrillic letters to Latin equivalents for comparison
const CYR_TO_LAT={
  'А':'A','а':'a','Б':'B','б':'b','В':'V','в':'v','Г':'G','г':'g',
  'Д':'D','д':'d','Е':'E','е':'e','Ё':'E','ё':'e','Ж':'Zh','ж':'zh',
  'З':'Z','з':'z','И':'I','и':'i','Й':'Y','й':'y','К':'K','к':'k',
  'Л':'L','л':'l','М':'M','м':'m','Н':'N','н':'n','О':'O','о':'o',
  'П':'P','п':'p','Р':'R','р':'r','С':'S','с':'s','Т':'T','т':'t',
  'У':'U','у':'u','Ф':'F','ф':'f','Х':'X','х':'x','Ц':'Ts','ц':'ts',
  'Ч':'Ch','ч':'ch','Ш':'Sh','ш':'sh','Щ':'Sh','щ':'sh','Ъ':'','ъ':'',
  'Ы':'I','ы':'i','Ь':'','ь':'','Э':'E','э':'e','Ю':'Yu','ю':'yu',
  'Я':'Ya','я':'ya','Ў':'O\'','ў':'o\'','Қ':'Q','қ':'q','Ғ':'G\'','ғ':'g\'',
  'Ҳ':'H','ҳ':'h','Ъ':'\'','ъ':'\'',
};
function normName(name){
  if(!name)return"";
  let s=name.trim();
  // transliterate Cyrillic to Latin
  let res="";
  for(const ch of s){res+=CYR_TO_LAT[ch]!==undefined?CYR_TO_LAT[ch]:ch;}
  // normalize: lowercase, collapse spaces, remove apostrophes/quotes for comparison
  return res.toLowerCase().replace(/['`ʼ'']/g,"").replace(/\s+/g," ").trim();
}

// ─── CSV Parser ───────────────────────────────────────────────────────────────
function splitCSVLine(line){
  const r=[];let cur="",inQ=false;
  for(const c of line){if(c==='"'){inQ=!inQ;continue;}if(c===','&&!inQ){r.push(cur);cur="";continue;}cur+=c;}
  r.push(cur);return r;
}

// Detect which subject is in which column by reading header rows
// Returns: {mathCol, inglizCol, muammoCol, jamiCol, nameCol, filialCol, guruhCol}
function detectColumns(lines){
  // Default mapping (your current CSV format)
  let cols={nameCol:1,filialCol:2,guruhCol:3,mathFoizCol:5,inglizFoizCol:-1,muammoFoizCol:7,jamiFoizCol:8};

  // Look at rows 1-3 for subject headers
  for(let i=0;i<Math.min(4,lines.length);i++){
    const row=splitCSVLine(lines[i]).map(c=>c.toLowerCase().trim());
    for(let j=0;j<row.length;j++){
      const cell=row[j];
      if(cell.includes("matematik") || cell.includes("математик")){
        // next col with "foiz" or "%" or just next = ball, one after = foiz
        cols.mathFoizCol=j+1; // foiz is usually ball+1
      }
      if(cell.includes("ingliz") || cell.includes("англий")){
        cols.inglizFoizCol=j+1;
      }
      if(cell.includes("muammo") || cell.includes("tanqid") || cell.includes("муамм")){
        cols.muammoFoizCol=j+1;
      }
      if(cell.includes("jami") || cell.includes("итого") || cell.includes("общ")){
        cols.jamiFoizCol=j;
      }
    }
  }
  return cols;
}

function parseCSV(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const result=[];
  if(lines.length<2)return result;

  // detect columns from headers
  const C=detectColumns(lines);

  // find data start: first row where col[nameCol] looks like a name (not a header)
  let dataStart=1;
  for(let i=0;i<Math.min(6,lines.length);i++){
    const row=splitCSVLine(lines[i]);
    const cell=(row[C.nameCol]||"").trim();
    // name row: not empty, not a known header keyword, contains space (firstname lastname)
    const isHeader=!cell||["f.i.o","исм","ism","фио","ф.и.о","name","имя"].some(h=>cell.toLowerCase().includes(h));
    if(cell&&!isHeader){dataStart=i;break;}
  }

  for(let i=dataStart;i<lines.length;i++){
    const c=splitCSVLine(lines[i]);
    const name=(c[C.nameCol]||"").trim();
    if(!name)continue;

    const getNum=idx=>{
      if(idx<0||idx>=c.length)return 0;
      return parseFloat((c[idx]||"0").replace(",","."))||0;
    };

    const mathF  = getNum(C.mathFoizCol);
    const inglizF= getNum(C.inglizFoizCol);
    const muammoF= getNum(C.muammoFoizCol);
    const jamiF  = getNum(C.jamiFoizCol);

    if(mathF===0&&inglizF===0&&muammoF===0&&jamiF===0)continue;

    result.push({
      name,
      filial:(c[C.filialCol]||"").trim(),
      guruh :(c[C.guruhCol]||"").trim(),
      mathF, inglizF, muammoF, jamiF,
    });
  }
  return result;
}

// ─── Merge CSV rows into existing students (ADDITIVE) ─────────────────────────
function mergeCSVIntoStudents(csvRows, existingStudents, sessionDate){
  const result=existingStudents.map(s=>({
    ...s,
    scores:s.scores.map(a=>[...a]),
    days:(s.days||[[],[],[]]).map(a=>[...a]),
  }));

  for(const row of csvRows){
    const d=sessionDate||"";
    const normRow=normName(row.name);

    // Find existing student by normalized name comparison
    const idx=result.findIndex(s=>normName(s.name)===normRow);

    if(idx>=0){
      const s=result[idx];
      const days=s.days||[[],[],[]];
      // scores[0]=Matematika, scores[1]=Ingliz tili, scores[2]=Muammoni hal qilish
      if(row.mathF>0)  {s.scores[0].push(row.mathF);  days[0].push(d);}
      if(row.inglizF>0){s.scores[1].push(row.inglizF);days[1].push(d);}
      if(row.muammoF>0){s.scores[2].push(row.muammoF);days[2].push(d);}
      s.days=days;
      result[idx]=s;
    } else {
      const scores=[[],[],[]];
      const days=[[],[],[]];
      if(row.mathF>0)  {scores[0].push(row.mathF);  days[0].push(d);}
      if(row.inglizF>0){scores[1].push(row.inglizF);days[1].push(d);}
      if(row.muammoF>0){scores[2].push(row.muammoF);days[2].push(d);}
      result.push({id:uid(),name:row.name,filial:row.filial,guruh:row.guruh,scores,days});
    }
  }
  return result;
}

// ─── App State ────────────────────────────────────────────────────────────────
const S={
  teacher : ld("st_teacher")||"Ustoz",
  lang    : ld("st_lang")||"uz",
  students: ld("st_students")||[],
  search  : "",
  page    : "list",
  active  : null,
  editIdx : null,
  csvLoading: false,
  csvErr  : "",
  showImport: false,
  importUrl : ld("st_importUrl")||"",
};
const setState=(p,noRender)=>{Object.assign(S,p);if(!noRender)render();};

let BUF={entries:[],name:"",teacher:"",editScore:"",editDate:"",importUrl:""};
function resetBuf(){BUF={entries:[{id:uid(),si:0,score:"",date:""}],name:"",teacher:S.teacher,editScore:"",editDate:"",importUrl:S.importUrl};}

// ─── SVG Chart ────────────────────────────────────────────────────────────────
function makeSVG(scores,days){
  if(!scores||!scores.length)return`<div style="color:#2a2a45;text-align:center;padding:22px 0;font-size:12px">Ma'lumot yo'q</div>`;
  const W=300,H=110,PL=34,PB=22,PT=16,PR=8,cW=W-PL-PR,cH=H-PB-PT;
  const pts=scores.map((v,i)=>({x:PL+(i/Math.max(scores.length-1,1))*cW,y:PT+cH-(v/100)*cH,v}));
  const poly=pts.map(p=>`${p.x},${p.y}`).join(" ");
  const area=`${pts[0].x},${PT+cH} ${poly} ${pts[pts.length-1].x},${PT+cH}`;
  const grow=scores.length>1&&scores[scores.length-1]>=scores[0];
  const diff=scores.length>1?Math.round((scores[scores.length-1]-scores[0])/Math.max(scores[0],1)*100):0;
  const lc=grow?"#34d399":"#f87171",fc=grow?"#34d39918":"#f8717118";
  const grids=[0,25,50,75,100].map(s=>{const y=PT+cH-(s/100)*cH;return`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#1e1e33" stroke-width="1"/><text x="${PL-4}" y="${y+4}" fill="#3a3a5a" font-size="8" text-anchor="end">${s}</text>`;}).join("");
  const dots=pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${lc}"/><text x="${p.x}" y="${p.y-6}" fill="${lc}" font-size="7" text-anchor="middle">${p.v}%</text><text x="${p.x}" y="${H-3}" fill="#3a3a5a" font-size="7" text-anchor="middle">${days&&days[i]?days[i]:i+1}</text>`).join("");
  return`<div style="display:flex;justify-content:flex-end;margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${lc};background:${lc}22;padding:2px 8px;border-radius:20px">${diff>0?"▲":diff<0?"▼":"—"} ${Math.abs(diff)}%</span></div><svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">${grids}<polygon points="${area}" fill="${fc}"/><polyline points="${poly}" fill="none" stroke="${lc}" stroke-width="2" stroke-linejoin="round"/>${dots}<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT+cH}" stroke="#2a2a45" stroke-width="1"/></svg>`;
}

// ─── Entry rows ───────────────────────────────────────────────────────────────
function entryRows(){
  return BUF.entries.map((en,idx)=>`
  <div style="background:#0f0f1a;border:1px solid #1e1e33;border-radius:12px;padding:12px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:11px;color:#888">${idx+1}-natija</span>
      ${BUF.entries.length>1?`<span onclick="rmEntry('${en.id}')" style="color:#f87171;font-size:16px;cursor:pointer">✕</span>`:""}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      ${SC.map((lbl,si)=>`<div onclick="pickSi('${en.id}',${si})" style="flex:1;text-align:center;padding:7px 4px;border-radius:8px;font-size:10px;font-weight:600;cursor:pointer;border:1.5px solid ${en.si===si?COLORS[si]:"#1e1e33"};color:${en.si===si?COLORS[si]:"#555"};background:${en.si===si?COLORS[si]+"18":"transparent"}">${lbl}</div>`).join("")}
    </div>
    <div style="display:flex;gap:8px">
      <div style="flex:1">
        <div style="font-size:10px;color:#555;margin-bottom:4px">Natija</div>
        <input value="${esc(en.score)}" placeholder="12/20 yoki 85" oninput="liveScore('${en.id}',this.value)" style="width:100%;background:#07070f;border:1.5px solid ${COLORS[en.si]}44;color:#e2e8f0;border-radius:8px;padding:9px 10px;font-size:13px;outline:none;font-family:monospace"/>
      </div>
      <div style="flex:1">
        <div style="font-size:10px;color:#555;margin-bottom:4px">Sana</div>
        <input type="date" value="${en.date}" onchange="liveDate('${en.id}',this.value)" style="width:100%;background:#07070f;border:1.5px solid #2a2a45;color:#888;border-radius:8px;padding:9px 10px;font-size:12px;outline:none"/>
      </div>
    </div>
    <div id="prev_${en.id}" style="margin-top:7px;font-size:10px;color:${COLORS[en.si]}">${en.score&&parseF(en.score)!==null?`→ ${parseF(en.score)}% (${grade(parseF(en.score)).l})`:""}</div>
  </div>`).join("");
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render(){
  let overlay="";
  if(S.page==="addStudent")  overlay=renderAddSheet();
  else if(S.page==="addScore")    overlay=renderScoreSheet();
  else if(S.page==="detail")      overlay=renderDetail();
  else if(S.page==="editName")    overlay=renderEditName();
  else if(S.page==="delConfirm")  overlay=renderDelConfirm();
  else if(S.page==="editTeacher") overlay=renderTeacher();
  else if(S.page==="import")      overlay=renderImport();
  document.getElementById("root").innerHTML=
    renderHeader()+renderStats()+renderSearch()+
    `<div style="padding:14px;padding-bottom:40px">${renderList()}</div>`+overlay;
}

// ─── Header ───────────────────────────────────────────────────────────────────
function renderHeader(){
  const ini=S.teacher.trim()?S.teacher.trim()[0].toUpperCase():"U";
  return`<div style="background:linear-gradient(135deg,#0d0d1f,#12122a);border-bottom:1px solid #1a1a30;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100">
    <!-- Circle 1: Teacher -->
    <div class="pill" onclick="go('editTeacher')" style="background:linear-gradient(135deg,#7c3aed,#4f46e5);font-size:20px;font-weight:900;color:#fff;box-shadow:0 0 0 2px #a78bfa44">${ini}</div>
    <!-- Circle 2: Add student -->
    <div class="pill" onclick="go('addStudent')" style="background:#111127;border:2px dashed #a78bfa66;font-size:24px;color:#a78bfa">+</div>
    <!-- Circle 3: Lang -->
    <div class="pill" onclick="toggleLang()" style="background:#111127;border:1.5px solid #2a2a45;font-size:10px;font-weight:900;color:#a78bfa">${S.lang==="uz"?"UZ":"RU"}</div>
    <!-- Title -->
    <div style="flex:1;min-width:0">
      <div style="font-size:16px;font-weight:900;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${S.lang==="uz"?"O'zlashtirish Tahlili":"Анализ Успеваемости"}</div>
      <div style="font-size:9px;color:#3a3a5a">${S.lang==="uz"?"Test natijalari asosida":"По результатам тестов"}</div>
    </div>
    <!-- CSV button -->
    <button onclick="document.getElementById('csvFileInp').click()" style="background:#052e16;border:1px solid #34d39944;color:#34d399;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700;flex-shrink:0" title="CSV yuklash">📂</button>
    <!-- Link button -->
    <button onclick="go('import')" style="background:#0d0d2e;border:1px solid #60a5fa44;color:#60a5fa;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700;flex-shrink:0" title="Link yuklash">🔗</button>
  </div>`;
}

// ─── Stats ────────────────────────────────────────────────────────────────────
function renderStats(){
  const st={
    total:S.students.length,
    alo:S.students.filter(s=>ovAvg(s)>=85).length,
    yaxshi:S.students.filter(s=>ovAvg(s)>=70&&ovAvg(s)<85).length,
    past:S.students.filter(s=>ovAvg(s)<55).length
  };
  return`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px 0">
    ${[["Jami","Всего",st.total,"#a78bfa"],["A'lo","A'lo",st.alo,"#34d399"],["70-84%","70-84%",st.yaxshi,"#60a5fa"],["<55%","<55%",st.past,"#f87171"]].map(([uz,ru,v,c])=>`<div style="background:#0f0f1a;border:1px solid ${c}33;border-radius:12px;padding:10px 6px;text-align:center"><div style="font-size:20px;font-weight:900;color:${c};font-family:monospace">${v}</div><div style="font-size:9px;color:#555;margin-top:1px">${S.lang==="uz"?uz:ru}</div></div>`).join("")}
  </div>`;
}

// ─── Search ───────────────────────────────────────────────────────────────────
function renderSearch(){
  return`<div style="padding:10px 14px 0"><div style="display:flex;align-items:center;gap:10px;background:#0f0f1a;border:1.5px solid #2a2a45;border-radius:999px;padding:10px 18px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="searchInp" value="${esc(S.search)}" oninput="doSearch(this.value)" placeholder="${S.lang==="uz"?"O'quvchi qidiring...":"Поиск ученика..."}" style="flex:1;background:transparent;border:none;outline:none;color:#e2e8f0;font-size:13px"/>${S.search?`<span onclick="doSearch('')" style="color:#444;cursor:pointer">✕</span>`:""}</div></div>`;
}

// ─── Student List ─────────────────────────────────────────────────────────────
function renderList(){
  const filtered=S.students.filter(s=>s.name.toLowerCase().includes(S.search.toLowerCase()));
  if(!filtered.length)return`<div style="text-align:center;color:#2a2a45;padding:56px 0;font-size:13px">${S.students.length===0?"Hali o'quvchi yo'q.\n＋ tugmasi yoki 📂 CSV yuklang":"Hech kim topilmadi"}</div>`;
  return filtered.map(s=>{
    const ov=ovAvg(s),g=grade(ov);
    return`<div style="background:#0f0f1a;border:1.5px solid #1a1a2e;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
        <div class="icon-btn" onclick="editName('${s.id}')" style="background:#4f46e522;border-color:#4f46e555">✏️</div>
        <div class="icon-btn" onclick="delConfirm('${s.id}')" style="background:#dc262622;border-color:#dc262655">🗑️</div>
      </div>
      <div onclick="openDetail('${s.id}')" style="flex:1;cursor:pointer">
        <div style="font-size:15px;font-weight:700;color:#e2e8f0">${esc(s.name)}</div>
        ${s.filial?`<div style="font-size:9px;color:#555;margin-top:2px">${esc(s.filial)}${s.guruh?" • "+esc(s.guruh):""}</div>`:""}
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <button onclick="openAddScore('${s.id}')" style="background:#1a1a2e;border:1px solid #2a2a45;color:#a78bfa;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700">+ Ball</button>
        <div onclick="openDetail('${s.id}')" style="text-align:right;cursor:pointer">
          <div style="font-size:22px;font-weight:900;color:${g.c};font-family:monospace">${ov}%</div>
          <div style="font-size:9px;color:${g.c};background:${g.c}22;border-radius:6px;padding:2px 6px">${g.l}</div>
        </div>

          <div style="display:flex;gap:8px">

        <div style="flex:1"><span style="font-family:monospace;font-weight:700;color:${COLORS[si]};font-size:14px">${v}%</span>${d?`<span style="font-size:10px;color:#444;margin-left:8px">${fmt(d)}</span>`:""}</div>
        <div class="icon-btn" onclick="startEdit(${si},${i},${v},'${d}')" style="background:#4f46e522;border-color:#4f46e544">✏️</div>
        <div class="icon-btn" onclick="delEntry(${si},${i})" style="background:#dc262622;border-color:#dc262644">🗑️</div>
      </div>`;
    }).join("");
    return`<div style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:11px;font-weight:700;color:${COLORS[si]}">${subj}</span>
        <span style="font-size:10px;color:#555;font-family:monospace">o'rta: ${avg(scores)}%</span>
      </div>
      <div style="background:#07070f;border-radius:12px;padding:8px;margin-bottom:8px;overflow-x:auto">${makeSVG(sorted.map(x=>x.v),sorted.map(x=>fmt(x.d)))}</div>

  }).join("");
  return`<div class="overlay" onclick="back()"><div class="modal anim-zoom" onclick="event.stopPropagation()">

        <div style="font-size:10px;color:#3a3a5a;margin-top:2px">Butun davr tahlili</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:28px;font-weight:900;color:${g.c};font-family:monospace">${ov}%</div>
        <div style="font-size:10px;color:${g.c};background:${g.c}22;border-radius:6px;padding:2px 8px">${g.l}</div>

// ─── CSV Loading ──────────────────────────────────────────────────────────────
function handleCSVText(text){
  const date=document.getElementById("importDateInp")?.value||"";
  const rows=parseCSV(text);
  if(!rows.length){setState({csvErr:"Ma'lumot topilmadi. Fayl formatini tekshiring.",csvLoading:false});return;}
  const merged=mergeCSVIntoStudents(rows,S.students,date);
  sv("st_students",merged);
  setState({students:merged,page:"list",csvLoading:false,csvErr:""});
  setTimeout(()=>alert(`✅ ${rows.length} ta o'quvchi qo'shildi/yangilandi!`),100);
}

async function loadFromLink(){
  const url=(BUF.importUrl||document.getElementById("importUrlInp")?.value||"").trim();
  if(!url){setState({csvErr:"Link kiriting"});return;}
  sv("st_importUrl",url);
  setState({csvLoading:true,csvErr:"",importUrl:url});
  try{
    const idMatch=url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    const gidMatch=url.match(/[?&]gid=(\d+)/);
    let csvUrl=url;
    if(idMatch){
      const gid=gidMatch?gidMatch[1]:"0";
      csvUrl=`https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv&gid=${gid}`;
    }
    const res=await fetch(csvUrl);
    if(!res.ok)throw new Error("Server: "+res.status);
    handleCSVText(await res.text());
  }catch(e){
    setState({csvErr:"Xatolik: "+e.message+". Sheets 'Anyone with link can view' bo'lishi kerak.",csvLoading:false});
  }
}

// File input handler
document.getElementById("csvFileInp").addEventListener("change",function(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>handleCSVText(ev.target.result);
  reader.readAsText(file,"UTF-8");
  e.target.value="";
});

// ─── Live updates ─────────────────────────────────────────────────────────────
function liveScore(id,val){
  const en=BUF.entries.find(e=>e.id===id);if(!en)return;en.score=val;
  const p=parseF(val),el=document.getElementById(`prev_${id}`);
  if(el)el.textContent=(p!==null&&val.trim())?`→ ${p}% (${grade(p).l})`:"";
}
function liveDate(id,val){const en=BUF.entries.find(e=>e.id===id);if(en)en.date=val;}
function liveEditScore(val){
  BUF.editScore=val;
  const p=parseF(val),el=document.getElementById("editPrev");
  if(el)el.textContent=(p!==null&&val.trim())?`→ ${p}% (${grade(p).l})`:"";
}

function refreshEntryList(){const el=document.getElementById("entryList");if(el)el.innerHTML=entryRows();}
function addEntry(){BUF.entries.push({id:uid(),si:0,score:"",date:""});refreshEntryList();}
function rmEntry(id){if(BUF.entries.length<2)return;BUF.entries=BUF.entries.filter(e=>e.id!==id);refreshEntryList();}
function pickSi(id,si){const en=BUF.entries.find(e=>e.id===id);if(en){en.si=Number(si);refreshEntryList();}}

// ─── Navigation ───────────────────────────────────────────────────────────────
function back(){resetBuf();setState({page:"list",active:null,editIdx:null,csvLoading:false,csvErr:""});}

function doSearch(v){S.search=v;render();}
function openDetail(id){const s=S.students.find(x=>x.id===id);if(s){resetBuf();setState({page:"detail",active:{...s},editIdx:null});}}
function openAddScore(id){const s=S.students.find(x=>x.id===id);if(s){resetBuf();setState({page:"addScore",active:s});}}
function editName(id){const s=S.students.find(x=>x.id===id);if(s){resetBuf();BUF.name=s.name;setState({page:"editName",active:s});}}
function delConfirm(id){const s=S.students.find(x=>x.id===id);if(s)setState({page:"delConfirm",active:s});}

// ─── Save ─────────────────────────────────────────────────────────────────────
function saveStudent(){
  const name=(BUF.name||document.getElementById("nameInp")?.value||"").trim();
  if(!name){showErr("addErr","Ism kiriting");return;}
  const scores=[[],[],[]],days=[[],[],[]];
  for(const en of BUF.entries){
    if(!en.score.trim())continue;
    const p=parseF(en.score);
    if(p===null){showErr("addErr",`"${en.score}" noto'g'ri`);return;}
    scores[en.si].push(p);days[en.si].push(en.date||"");
  }
  const ns=[...S.students,{id:uid(),name,scores,days}];
  sv("st_students",ns);resetBuf();setState({students:ns,page:"list"});
}

function saveScore(){
  const s=S.active;if(!s)return;
  const ns=[[],[],[]],nd=[[],[],[]];
  for(const en of BUF.entries){
    if(!en.score.trim())continue;
    const p=parseF(en.score);
    if(p===null){showErr("addErr",`"${en.score}" noto'g'ri`);return;}
    ns[en.si].push(p);nd[en.si].push(en.date||"");
  }
  const days=s.days||[[],[],[]];
  const upd={...s,scores:s.scores.map((a,i)=>[...a,...ns[i]]),days:days.map((a,i)=>[...a,...nd[i]])};
  const all=S.students.map(x=>x.id===upd.id?upd:x);
  sv("st_students",all);resetBuf();setState({students:all,page:"list",active:null});
}

function doEditName(){
  const name=(BUF.name||document.getElementById("editNameInp")?.value||"").trim();
  if(!name)return;
  const all=S.students.map(x=>x.id===S.active.id?{...x,name}:x);
  sv("st_students",all);resetBuf();setState({students:all,page:"list",active:null});
}

function doDelete(){
  const all=S.students.filter(x=>x.id!==S.active.id);
  sv("st_students",all);setState({students:all,page:"list",active:null});
}

function doSaveTeacher(){
  const name=(BUF.teacher||document.getElementById("teacherInp")?.value||"").trim()||"Ustoz";
  sv("st_teacher",name);resetBuf();setState({teacher:name,page:"list"});
}

function startEdit(si,idx,v,d){BUF.editScore=String(v);BUF.editDate=d;setState({editIdx:{si:Number(si),idx:Number(idx)}});}
function cancelEdit(){BUF.editScore="";BUF.editDate="";setState({editIdx:null});}

function saveEntryEdit(si,idx){
  const val=BUF.editScore||document.getElementById("editScoreInp")?.value||"";
  const date=BUF.editDate||document.getElementById("editDateInp")?.value||"";
  const p=parseF(val);
  if(p===null){const el=document.getElementById("editErr");if(el){el.style.display="block";el.textContent="Noto'g'ri format";}return;}
  const s=S.active;
  const newScores=s.scores.map((arr,i)=>i==si?arr.map((v,j)=>j==idx?p:v):arr);
  const newDays=(s.days||[[],[],[]]).map((arr,i)=>i==si?arr.map((v,j)=>j==idx?date:v):arr);
  const upd={...s,scores:newScores,days:newDays};
  const all=S.students.map(x=>x.id===upd.id?upd:x);
  sv("st_students",all);BUF.editScore="";BUF.editDate="";
  setState({students:all,active:upd,editIdx:null});
}

function delEntry(si,idx){
  const s=S.active;
  const newScores=s.scores.map((arr,i)=>i==si?arr.filter((_,j)=>j!=idx):arr);
  const newDays=(s.days||[[],[],[]]).map((arr,i)=>i==si?arr.filter((_,j)=>j!=idx):arr);
  const upd={...s,scores:newScores,days:newDays};
  const all=S.students.map(x=>x.id===upd.id?upd:x);
  sv("st_students",all);setState({students:all,active:upd,editIdx:null});
}

function showErr(id,msg){const el=document.getElementById(id);if(el){el.style.display="block";el.textContent=msg;}}

// ─── Init ─────────────────────────────────────────────────────────────────────
resetBuf();render();
</script>
