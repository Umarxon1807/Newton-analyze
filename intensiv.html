<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Intensiv"/>
<meta name="theme-color" content="#07070f"/>
<title>Intensiv Natijalari</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{min-height:100%;background:#07070f;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden}
input,button,select{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes zoomIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.fade{animation:fadeIn .3s ease}
.zoom{animation:zoomIn .25s cubic-bezier(.34,1.56,.64,1)}
.up{animation:slideUp .28s ease}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ─── Colors & Grades ──────────────────────────────────────────────────────────
const grade = v => {
  if(v >= 85) return {l:"A'lo",       c:"#34d399", bg:"#34d39920"};
  if(v >= 70) return {l:"Yaxshi",     c:"#60a5fa", bg:"#60a5fa20"};
  if(v >= 55) return {l:"Qoniqarli",  c:"#fbbf24", bg:"#fbbf2420"};
  if(v >  0)  return {l:"Qoniqarsiz", c:"#f87171", bg:"#f8717120"};
  return              {l:"Kiritilmagan", c:"#555", bg:"#55555520"};
};

const FILIALS = ["Barchasi", "Parkent", "Rakat", "Sergeli", "Chilonzor", "Ganga"];

// ─── State ────────────────────────────────────────────────────────────────────
let students = [];
let filtered = [];
let search = "";
let filialFilter = "Barchasi";
let sortBy = "jami"; // jami | ism | math | muammo
let sortAsc = false;
let selected = null;
let sheetUrl = localStorage.getItem("sheetUrl") || "";
let loading = false;
let loadErr = "";
let showUrlInput = false;

// ─── CSV Parser ───────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.split("\n").map(l => l.trim()).filter(l => l);
  const result = [];
  for(let i = 3; i < lines.length; i++) {
    const cols = splitCSVLine(lines[i]);
    const name = (cols[1] || "").trim();
    if(!name) continue;
    const mathBall  = parseFloat((cols[4] || "0").replace(",",".")) || 0;
    const mathFoiz  = parseFloat((cols[5] || "0").replace(",",".")) || 0;
    const muammoBall= parseFloat((cols[6] || "0").replace(",",".")) || 0;
    const muammoFoiz= parseFloat((cols[7] || "0").replace(",",".")) || 0;
    const jamiFoiz  = parseFloat((cols[8] || "0").replace(",",".")) || 0;
    if(mathBall === 0 && muammoBall === 0 && jamiFoiz === 0) continue;
    result.push({
      id: i,
      name,
      filial: (cols[2] || "").trim(),
      guruh:  (cols[3] || "").trim(),
      math:   { ball: mathBall,   foiz: mathFoiz },
      muammo: { ball: muammoBall, foiz: muammoFoiz },
      jami:   jamiFoiz,
    });
  }
  return result;
}

function splitCSVLine(line) {
  const result = [];
  let cur = "", inQ = false;
  for(let i = 0; i < line.length; i++) {
    const c = line[i];
    if(c === '"') { inQ = !inQ; continue; }
    if(c === ',' && !inQ) { result.push(cur); cur = ""; continue; }
    cur += c;
  }
  result.push(cur);
  return result;
}

function applyFilters() {
  let arr = [...students];
  if(filialFilter !== "Barchasi") arr = arr.filter(s => s.filial === filialFilter);
  if(search.trim()) {
    const q = search.toLowerCase();
    arr = arr.filter(s => s.name.toLowerCase().includes(q));
  }
  arr.sort((a,b) => {
    let va, vb;
    if(sortBy === "ism")    { va = a.name; vb = b.name; return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va); }
    if(sortBy === "math")   { va = a.math.foiz; vb = b.math.foiz; }
    if(sortBy === "muammo") { va = a.muammo.foiz; vb = b.muammo.foiz; }
    else                    { va = a.jami; vb = b.jami; }
    return sortAsc ? va - vb : vb - va;
  });
  filtered = arr;
}

// ─── Load CSV from URL ────────────────────────────────────────────────────────
async function loadFromUrl(url) {
  loading = true; loadErr = ""; render();
  try {
    // Convert share URL to CSV export URL
    let csvUrl = url;
    const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    const gidMatch = url.match(/[?&]gid=(\d+)/);
    if(idMatch) {
      const id = idMatch[1];
      const gid = gidMatch ? gidMatch[1] : "0";
      csvUrl = `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;
    }
    const res = await fetch(csvUrl);
    if(!res.ok) throw new Error("Yuklab bo'lmadi: " + res.status);
    const text = await res.text();
    students = parseCSV(text);
    localStorage.setItem("sheetUrl", url);
    localStorage.setItem("cachedCSV", text);
    localStorage.setItem("cacheTime", Date.now());
  } catch(e) {
    loadErr = "Xatolik: " + e.message + ". Sheets 'Anyone with link can view' bo'lishi kerak.";
  }
  loading = false;
  applyFilters();
  render();
}

// Load from file
function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    students = parseCSV(e.target.result);
    localStorage.setItem("cachedCSV", e.target.result);
    localStorage.setItem("cacheTime", Date.now());
    applyFilters();
    render();
  };
  reader.readAsText(file, "UTF-8");
}

// Load cached on start
function loadCached() {
  const csv = localStorage.getItem("cachedCSV");
  if(csv) {
    students = parseCSV(csv);
    applyFilters();
  }
}

// ─── Stats ────────────────────────────────────────────────────────────────────
function calcStats(arr) {
  const n = arr.length;
  if(!n) return {n:0, avg:0, alo:0, yaxshi:0, qon:0, past:0};
  return {
    n,
    avg:    Math.round(arr.reduce((s,x)=>s+x.jami,0)/n * 10) / 10,
    alo:    arr.filter(x=>x.jami>=85).length,
    yaxshi: arr.filter(x=>x.jami>=70&&x.jami<85).length,
    qon:    arr.filter(x=>x.jami>=55&&x.jami<70).length,
    past:   arr.filter(x=>x.jami>0&&x.jami<55).length,
  };
}

// ─── Render ───────────────────────────────────────────────────────────────────
function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render() {
  document.getElementById("root").innerHTML = buildHTML();
}

function buildHTML() {
  const stats = calcStats(filtered);
  const cacheTime = localStorage.getItem("cacheTime");
  const timeStr = cacheTime ? new Date(+cacheTime).toLocaleString("uz-UZ") : "";

  // ── Header
  const hdr = `
  <div style="background:linear-gradient(135deg,#0d0d1f,#12122a);border-bottom:1px solid #1a1a30;padding:14px 16px;position:sticky;top:0;z-index:100">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <div style="flex:1;min-width:0">
        <div style="font-size:17px;font-weight:900;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Intensiv Natijalari</div>
        ${timeStr?`<div style="font-size:9px;color:#3a3a5a">Yangilangan: ${timeStr}</div>`:""}
      </div>
      <button onclick="document.getElementById('fileInp').click()" style="background:#052e16;border:1px solid #34d39944;color:#34d399;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700">📂 CSV</button>
      <button onclick="toggleUrlInput()" style="background:#0d0d2e;border:1px solid #a78bfa44;color:#a78bfa;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700">🔗 Link</button>
      <button onclick="refresh()" style="background:#0d0d2e;border:1px solid #60a5fa44;color:#60a5fa;border-radius:8px;padding:7px 10px;font-size:13px" ${!sheetUrl?"disabled":""}>↻</button>
    </div>
    ${showUrlInput ? `
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="urlInp" value="${esc(sheetUrl)}" placeholder="Google Sheets linki..." oninput="sheetUrl=this.value"
        style="flex:1;background:#07070f;border:1.5px solid #a78bfa;color:#e2e8f0;border-radius:8px;padding:9px 12px;font-size:12px;outline:none"/>
      <button onclick="loadFromUrl(sheetUrl)" style="background:#a78bfa;color:#000;border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:12px">Yuklash</button>
    </div>` : ""}
    ${loadErr?`<div style="color:#f87171;font-size:11px;padding:8px;background:#f8717115;border-radius:8px;margin-bottom:8px">${esc(loadErr)}</div>`:""}
    ${loading?`<div style="color:#a78bfa;font-size:12px;padding:6px;text-align:center">⏳ Yuklanmoqda...</div>`:""}
  </div>`;

  // ── Stats bar
  const statsBar = `
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px 0">
    ${[
      ["Jami", stats.n, "#a78bfa"],
      ["A'lo", stats.alo, "#34d399"],
      ["Yaxshi", stats.yaxshi, "#60a5fa"],
      ["Qon.", stats.qon, "#fbbf24"],
      ["Past", stats.past, "#f87171"],
    ].map(([l,v,c])=>`
    <div style="background:#0f0f1a;border:1px solid ${c}33;border-radius:10px;padding:8px 4px;text-align:center">
      <div style="font-size:18px;font-weight:900;color:${c};font-family:monospace">${v}</div>
      <div style="font-size:8px;color:#555">${l}</div>
    </div>`).join("")}
  </div>
  <div style="padding:6px 12px 0;text-align:center;font-size:10px;color:#3a3a5a">
    O'rtacha jami: <span style="color:#a78bfa;font-weight:700">${stats.avg}%</span>
  </div>`;

  // ── Filters
  const filialBtns = FILIALS.map(f=>`
    <div onclick="setFilial('${f}')" style="flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid ${filialFilter===f?"#a78bfa":"#2a2a45"};color:${filialFilter===f?"#a78bfa":"#555"};background:${filialFilter===f?"#a78bfa18":"transparent"};white-space:nowrap">${f}</div>
  `).join("");

  const filters = `
  <div style="padding:10px 12px 0">
    <div style="display:flex;align-items:center;gap:8px;background:#0f0f1a;border:1.5px solid #2a2a45;border-radius:999px;padding:9px 16px;margin-bottom:8px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input value="${esc(search)}" oninput="doSearch(this.value)" placeholder="O'quvchi qidiring..."
        style="flex:1;background:transparent;border:none;outline:none;color:#e2e8f0;font-size:13px"/>
      ${search?`<span onclick="doSearch('')" style="color:#444;cursor:pointer">✕</span>`:""}
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">${filialBtns}</div>
  </div>
  <div style="display:flex;gap:6px;padding:8px 12px 0;align-items:center">
    <span style="font-size:10px;color:#555;flex-shrink:0">Saralash:</span>
    ${[["jami","Jami"],["math","Matematika"],["muammo","Muammoli"],["ism","Ism"]].map(([k,l])=>`
    <div onclick="setSort('${k}')" style="padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid ${sortBy===k?"#a78bfa":"#2a2a45"};color:${sortBy===k?"#a78bfa":"#555"};background:${sortBy===k?"#a78bfa18":"transparent"};white-space:nowrap">
      ${l} ${sortBy===k?(sortAsc?"↑":"↓"):""}
    </div>`).join("")}
  </div>`;

  // ── Student list
  let listHTML = "";
  if(!students.length) {
    listHTML = `<div style="text-align:center;padding:60px 20px;color:#2a2a45;font-size:13px">
      Ma'lumot yo'q.<br><br>
      <span style="font-size:11px">📂 CSV tugmasi bilan fayl yuklang<br>yoki 🔗 Link orqali Google Sheets ulang</span>
    </div>`;
  } else if(!filtered.length) {
    listHTML = `<div style="text-align:center;padding:40px;color:#2a2a45;font-size:13px">Hech kim topilmadi</div>`;
  } else {
    listHTML = filtered.map((s,i) => {
      const g = grade(s.jami);
      const rank = i + 1;
      const rankColor = rank===1?"#fbbf24":rank===2?"#94a3b8":rank===3?"#cd7f32":"#3a3a5a";
      return `
      <div onclick="openDetail('${s.id}')" style="background:#0f0f1a;border:1.5px solid #1a1a2e;border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px">
        <div style="width:28px;text-align:center;font-size:12px;font-weight:900;color:${rankColor};flex-shrink:0;font-family:monospace">${rank}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:700;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</div>
          <div style="font-size:10px;color:#555;margin-top:2px">${esc(s.filial)} • ${esc(s.guruh)}</div>
          <div style="display:flex;gap:8px;margin-top:5px">
            <div style="font-size:9px">
              <span style="color:#34d399">M:</span>
              <span style="color:#888;font-family:monospace">${s.math.ball} ball (${s.math.foiz}%)</span>
            </div>
            <div style="font-size:9px">
              <span style="color:#f472b6">MM:</span>
              <span style="color:#888;font-family:monospace">${s.muammo.ball} ball (${s.muammo.foiz}%)</span>
            </div>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:22px;font-weight:900;color:${g.c};font-family:monospace">${s.jami}%</div>
          <div style="font-size:9px;color:${g.c};background:${g.bg};border-radius:6px;padding:2px 7px;margin-top:2px">${g.l}</div>
        </div>
      </div>`;
    }).join("");
  }

  // ── Detail modal
  let detailHTML = "";
  if(selected) {
    const s = selected;
    const g = grade(s.jami);
    const rank = filtered.findIndex(x=>x.id===s.id) + 1;

    // Mini bar chart for math vs muammo
    const mathW  = s.math.foiz || 0;
    const muamW  = s.muammo.foiz || 0;

    detailHTML = `
    <div onclick="closeDetail()" style="position:fixed;inset:0;background:#07070fdd;backdrop-filter:blur(10px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px">
      <div onclick="event.stopPropagation()" class="zoom" style="background:#0b0b18;border:1.5px solid #2a2a45;border-radius:20px;padding:20px 16px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto">
        
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
          <div style="flex:1;min-width:0;margin-right:12px">
            <div style="font-size:18px;font-weight:900;color:#e2e8f0;line-height:1.3">${esc(s.name)}</div>
            <div style="font-size:11px;color:#555;margin-top:3px">${esc(s.filial)} • ${esc(s.guruh)}</div>
            <div style="font-size:10px;color:#a78bfa;margin-top:2px">Reyting: #${rank}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:32px;font-weight:900;color:${g.c};font-family:monospace">${s.jami}%</div>
            <div style="font-size:10px;color:${g.c};background:${g.bg};border-radius:6px;padding:2px 10px">${g.l}</div>
          </div>
        </div>

        <div style="background:#07070f;border-radius:14px;padding:14px;margin-bottom:14px">
          ${[
            ["Matematika", "#34d399", s.math.ball, s.math.foiz],
            ["Muammoli masalalar", "#f472b6", s.muammo.ball, s.muammo.foiz],
          ].map(([lbl,c,ball,foiz])=>{
            const g2 = grade(foiz);
            return `
            <div style="margin-bottom:12px">
              <div style="display:flex;justify-content:space-between;margin-bottom:5px">
                <span style="font-size:11px;font-weight:700;color:${c}">${lbl}</span>
                <span style="font-size:11px;color:#888;font-family:monospace">${ball} ball</span>
              </div>
              <div style="background:#1a1a2e;border-radius:6px;height:8px;overflow:hidden;margin-bottom:4px">
                <div style="height:100%;width:${foiz}%;background:${c};border-radius:6px;transition:width .5s"></div>
              </div>
              <div style="display:flex;justify-content:space-between">
                <span style="font-size:10px;color:${g2.c}">${g2.l}</span>
                <span style="font-size:10px;font-family:monospace;color:${c}">${foiz}%</span>
              </div>
            </div>`;
          }).join("")}
          
          <div style="border-top:1px solid #1a1a2e;padding-top:12px;margin-top:4px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:12px;font-weight:700;color:#e2e8f0">Jami natija</span>
              <span style="font-size:18px;font-weight:900;color:${g.c};font-family:monospace">${s.jami}%</span>
            </div>
            <div style="background:#1a1a2e;border-radius:6px;height:10px;overflow:hidden;margin-top:6px">
              <div style="height:100%;width:${s.jami}%;background:linear-gradient(90deg,${grade(s.math.foiz).c},${grade(s.muammo.foiz).c});border-radius:6px"></div>
            </div>
          </div>
        </div>

        <button onclick="closeDetail()" style="width:100%;background:#1a1a2e;border:1px solid #2a2a45;color:#666;border-radius:10px;padding:10px;font-size:12px">
          Yopish ✕
        </button>
      </div>
    </div>`;
  }

  return `
  <input type="file" id="fileInp" accept=".csv" onchange="handleFile(this)" style="display:none"/>
  ${hdr}
  ${students.length ? statsBar : ""}
  ${students.length ? filters : ""}
  <div style="padding:10px 12px 40px">${listHTML}</div>
  ${detailHTML}`;
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function handleFile(inp) {
  if(inp.files[0]) loadFile(inp.files[0]);
  inp.value = "";
}
function toggleUrlInput() {
  showUrlInput = !showUrlInput;
  render();
  if(showUrlInput) setTimeout(()=>document.getElementById("urlInp")?.focus(),50);
}
function refresh() {
  if(sheetUrl) loadFromUrl(sheetUrl);
}
function doSearch(v) {
  search = v;
  applyFilters();
  render();
  // keep focus
  setTimeout(()=>{
    const inp = document.querySelector('input[placeholder="O\'quvchi qidiring..."]');
    if(inp){ inp.focus(); inp.setSelectionRange(v.length,v.length); }
  },10);
}
function setFilial(f) {
  filialFilter = f;
  applyFilters();
  render();
}
function setSort(k) {
  if(sortBy === k) sortAsc = !sortAsc;
  else { sortBy = k; sortAsc = false; }
  applyFilters();
  render();
}
function openDetail(id) {
  selected = students.find(s=>String(s.id)===String(id));
  render();
}
function closeDetail() {
  selected = null;
  render();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
loadCached();
applyFilters();
render();
</script>
</body>
</html>
